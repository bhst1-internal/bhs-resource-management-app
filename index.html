          <div class="sec">
              <div class="sec-title">Title &amp; Criteria Details</div>
              <div class="grid g1">${field('Title', 'title', r.title)}</div>
              ${areaSection}
              ${dynamicSection}
          </div>

          <div class="sec" id="sec-vendor">
              <div class="sec-title">Vendor</div>
              <div class="grid g2">
                  <label class="f">Name
                      <div style="display:flex;gap:6px">
                          <select data-calc-group="vendorNameGrp" data-part="base" style="flex:1;min-width:0">
                              <option value=""></option>
                              ${VENDOR_OPTS.map(o => `<option value="${o}" ${(r.vendorNameBase || '') === o ? 'selected' : ''}>${o}</option>`).join('')}
                          </select>
                          ${(r.vendorNameBase || '') === 'Other' ? `<input type="text" data-calc-group="vendorNameGrp" data-part="vendor" placeholder="Specify..." value="${r.vendorNameOther || ''}" style="flex:1;min-width:0"/>` : ''}
                      </div>
                  </label>
                  ${field('Contact Person', 'vendorContactPerson', r.vendorContactPerson)}
              </div>
              <div class="grid g2" style="margin-top:10px">
                  ${field('Address', 'vendorAddress', r.vendorAddress, 'textarea')}
                  ${field('Contact Number', 'vendorContactNumber', r.vendorContactNumber)}
              </div>
          </div>

          <div class="sec" id="sec-category">
              <div class="sec-title">Category</div>
              <div class="check-row">${Object.entries(CATS).map(([k, l]) => checkbox(l, (r.cat1 || {})[k], 'cat1.' + k)).join('')}</div>
          </div>
          <div class="sec" id="sec-urgency">
              <div class="sec-title">Degree of Urgency &amp; CPCD</div>
              <div class="radio-row">${Object.entries(URGENCY).map(([k, l]) => radio('urgency', l, k, r.urgency === k, 'urgency')).join('')}</div>
              <div class="grid g4" style="margin-top:12px">
                  ${field('Contract Preparation Completion Date (CPCD)', 'ecd', r.ecd, 'date')}
              </div>
          </div>

          <div class="sec" id="sec-contract-dates">
              <div class="sec-title">Contract Start - End Date</div>
              <div class="radio-row">
                  ${['6 months', '12 months', '18 months', '24 months'].map(opt => radio('contractDuration', opt, opt, r.contractDuration === opt, 'contractDuration')).join('')}
              </div>
              <div class="grid g2" style="margin-top:12px">
                  ${field('Start Date', 'startDate', r.startDate, 'date')}
                  ${field('End Date', 'endDate', r.endDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
              </div>
          </div>

          <div class="sec">
              <div class="sec-title">Detail Description</div>
              ${field('Describe the detail description', 'reasonDetail', r.reasonDetail, 'textarea')}
          </div>
      </div>`;

      updateHighlights(container, r);
      const wrapAction = async () => {
        if (state.isDirty) {
          const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved");
          if (!discard) return false;
          revertActiveRecord();
        }
        return true;
      };

      container.querySelector('#acm-recpick').addEventListener('change', async (e) => {
        if (await wrapAction()) {
          state.showErrors = false;
          state.activeId = String(e.target.value);
          state.isDirty = false;
          render();
        } else e.target.value = state.activeId;
      });

      container.querySelector('#acm-new-btn').addEventListener('click', async () => {
        if (await wrapAction()) {
          await showModal("Notice", "Please enter accurate INPUT for records", "alert");
          const nr = blankRecord();
          nr.reportNo = getNextReportNo();
          state.records.unshift(nr);
          state.activeId = nr.createdAt;
          state.showErrors = false;
          state.isDirty = false;
          saveRecords();
          render();
        }
      });

      container.querySelector('#acm-del-btn').addEventListener('click', async () => {
        if (!await showModal("Confirm Deletion", "Delete this record? This cannot be undone.", "confirm")) return;
        const pass = await showModal("Authorization", "Password required to delete this record:", "prompt");
        if (pass === 'KLIA123!') {
          fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ payload: JSON.stringify({ action: 'delete', createdAt: r.createdAt }) }) }).catch(console.error);
          state.records = state.records.filter(x => String(x.createdAt) !== String(r.createdAt));
          state.activeId = state.records.length ? state.records[0].createdAt : null;
          state.showErrors = false;
          state.isDirty = false;
          saveRecords();
          render();
          await showModal("Deleted", "Record removed successfully.", "alert");
        } else if (pass !== null) await showModal("Error", "Incorrect password. Deletion cancelled.", "alert", true);
      });

      container.querySelector('#acm-submit-btn').addEventListener('click', async () => {
        state.showErrors = true;
        let errs = [];
        if (!checkReq(r.happeningDate)) errs.push("[Classification] Date Issued");
        if (!checkReq(r.issuedBy)) errs.push("[Classification] Issued By");
        if (!igBase || (igBase.toUpperCase() === 'OTHER' && (r.issuedGroup || '').trim().toUpperCase() === 'OTHER')) errs.push("[Classification] Criteria (Include Specify if Other)");
        if (!checkReq(r.reportNo)) errs.push("[Classification] Record No. (BHS/Record)");
        if (!checkReq(r.maintenanceType)) errs.push("[Classification] Classification");

        let needsEquipNo = igBase !== 'Other' && igBase !== 'Maintenance';
        let needsConvItem = ['Conveyor Line', 'Equipment/Tool'].includes(igBase);
        if (!checkReq(r.title) || !checkReq(r.area) || !checkReq(r.subArea) || !checkReq(r.areaNo)) {
          errs.push("[Title & Criteria Details] Title and Area fields are required");
        }
        if (igBase) {
          if (!checkReq(r.lineEquipment) || (needsEquipNo && !checkReq(r.equipNo)) || (needsConvItem && !checkReq(r.conveyorItem))) {
            errs.push("[Title & Criteria Details] Criteria specific fields are required");
          }
        }
        if (!(r.cat1 && Object.keys(CATS).some(k => r.cat1[k]))) errs.push("[Category] Select at least one category");
        if (!r.urgency) errs.push("[Degree of Urgency] Please select one");
        if ((r.reasonDetail || '').trim().split(/\s+/).filter(w => w.length > 0).length < 2) errs.push("[Detail Description] Please write at least 2 words");
        updateHighlights(container, r);

        if (errs.length) await showModal("Submit Failed", "Please complete the highlighted required data:\n\n- " + errs.join("\n- "), "alert", true);
        else {
          const statusLogic = getStatus(r);
          r.status = statusLogic === 'done' ? 'Completed' : statusLogic === 'progress' ? 'In progress' : 'Open';
          r.isDraft = false;
          state.showErrors = false;
          state.isDirty = false;
          state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
          saveRecords();
          const btn = container.querySelector('#acm-submit-btn'), ogTxt = btn.innerHTML;
          btn.innerHTML = 'Saving to Sheet ⏳';
          btn.style.pointerEvents = 'none';
          try {
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ payload: JSON.stringify(r) }) });
            setTimeout(async () => { await showModal("Success", "Record saved to Google Sheets!", "alert"); render(); }, 1200);
          } catch (e) {
            console.error(e);
            await showModal("Error", "An unexpected error occurred. Saved locally.", "alert", true);
            btn.innerHTML = ogTxt;
            btn.style.pointerEvents = 'auto';
          }
        }
      });

      container.querySelectorAll('[data-calc-group]').forEach(el => {
        if (el.tagName !== 'SELECT' && el.tagName !== 'INPUT') return;
        el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
          state.isDirty = true;
          const wrp = el.closest('div');
          const bVal = wrp.querySelector('[data-part="base"]')?.value || '';
          const vVal = wrp.querySelector('[data-part="vendor"]')?.value || '';
          const cg = el.getAttribute('data-calc-group');

          if (cg === 'vendorNameGrp') {
            r.vendorNameBase = bVal;
            r.vendorNameOther = vVal;
          } else {
            const isMainCat = cg === 'issuedGroup';
            const triggerVal = isMainCat ? 'Other' : 'Vendor';
            const newVal = (bVal === triggerVal) ? (vVal ? `${bVal}: ${vVal}` : bVal) : bVal;
            if (isMainCat) {
              let oldBase = r.issuedGroup || '';
              let parsedOld = oldBase.toUpperCase().startsWith('OTHER:') ? 'Other' : oldBase;
              if (bVal !== parsedOld) {
                r.lineEquipment = '';
                r.equipNo = '';
                r.conveyorItem = '';
              }
            }
            setByPath(r, cg, newVal);
          }

          saveRecords();
          if (el.getAttribute('data-part') === 'base') render();
          else updateHighlights(container, r);
        });
      });

      container.querySelectorAll('[data-path]').forEach(el => {
        if (el.tagName !== 'SELECT' && el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
        el.addEventListener((el.type === 'checkbox' || el.type === 'radio' || el.tagName === 'SELECT') ? 'change' : 'input', async () => {
          const path = el.getAttribute('data-path');
          let newVal = el.type === 'checkbox' ? el.checked : el.value;

          if (path === 'issuedBy' && newVal !== '') {
            const pwd = await showModal("Authorization", `Enter pin for ${newVal}:`, "prompt");
            if (pwd !== ISSUED_PASS[newVal]) {
              await showModal("Error", "Incorrect pin. Selection reversed.", "alert", true);
              el.value = r.issuedBy || '';
              return;
            }
          }

          state.isDirty = true;
          setByPath(r, path, newVal);

          if (['happeningDate', 'urgency', 'ecd', 'startDate', 'contractDuration'].includes(path)) {
            if (path === 'happeningDate' || path === 'urgency') {
              if (r.happeningDate && r.urgency) {
                const baseDate = new Date(r.happeningDate);
                if (!isNaN(baseDate.getTime())) {
                  let m = parseInt(r.urgency) || 0;
                  baseDate.setMonth(baseDate.getMonth() + m);
                  r.ecd = baseDate.toISOString().split('T')[0];
                  r.startDate = r.ecd;
                }
              }
            } else if (path === 'ecd') {
              r.startDate = r.ecd;
            }

            if (r.startDate && r.contractDuration) {
              const sd = new Date(r.startDate);
              if (!isNaN(sd.getTime())) {
                let dm = parseInt(r.contractDuration) || 0;
                sd.setMonth(sd.getMonth() + dm);
                r.endDate = sd.toISOString().split('T')[0];
              }
            }
            saveRecords();
            render();
            return;
          }

          if (path === 'area') { r.subArea = 'All'; r.areaNo = 'All'; saveRecords(); render(); return; }
          if (path === 'subArea') { r.areaNo = 'All'; saveRecords(); render(); return; }

          if (path === 'lineEquipment') {
            r.equipNo = '';
            container.querySelector('[data-path="equipNo"]').value = '';
            r.conveyorItem = '';
            container.querySelector('[data-path="conveyorItem"]').value = '';
            const nL = container.querySelector('#no-list');
            if (nL) {
              const opts = (r.lineEquipment && EQUIP_DB[r.lineEquipment]) ? Object.keys(EQUIP_DB[r.lineEquipment]).sort() : [];
              if (r.lineEquipment) opts.push('OTHERS');
              nL.innerHTML = opts.map(o => `<option value="${o}"></option>`).join('');
            }
          }

          if ((path === 'lineEquipment' || path === 'equipNo') && (!igBase || igBase === 'Conveyor Line')) {
            r.conveyorItem = (r.lineEquipment && r.equipNo) ? (r.equipNo === 'OTHERS' ? 'OTHERS' : ((EQUIP_DB[r.lineEquipment] && EQUIP_DB[r.lineEquipment][r.equipNo]) || '')) : '';
            const cEl = container.querySelector('[data-path="conveyorItem"]');
            if (cEl) cEl.value = r.conveyorItem;
          }
          saveRecords();
          updateHighlights(container, r);
        });
      });
    }

    /* =========================================================================
       CONTRACT MANAGEMENT MODULE
       ========================================================================= */
    function renderContractManagement(container) {
      const contracts = state.records.filter(r => !r.isDraft).sort((a, b) => b.createdAt - a.createdAt);
      let r = state.records.find(x => String(x.createdAt) === String(state.activeId));
      if (!r) {
        r = contracts.length ? contracts[0] : null;
        if (r) state.activeId = String(r.createdAt);
      }

      const getLatest = (clmNode) => Array.isArray(clmNode) ? (clmNode.length ? clmNode[clmNode.length - 1].status : null) : (clmNode ? clmNode.status : null);

      const rows = contracts.map(c => {
        const isActive = r && String(c.createdAt) === String(r.createdAt);
        let latestStatus = 'N/A';
        if (c.clm) {
          if (c.clm.renewal && c.clm.renewal.status) {
            latestStatus = c.clm.renewal.status;
          } else if (c.vendorMonitoring && c.vendorMonitoring.length > 0) {
            const lastHist = c.vendorMonitoring[c.vendorMonitoring.length - 1];
            const hasNotMet = lastHist.metrics && lastHist.metrics.some(m => m.status === 'Not Met');
            latestStatus = hasNotMet ? 'Breach' : 'Active';
          } else if (getLatest(c.clm.approval)) {
            latestStatus = getLatest(c.clm.approval);
          } else if (getLatest(c.clm.negotiations)) {
            latestStatus = getLatest(c.clm.negotiations);
          } else if (getLatest(c.clm.creation)) {
            latestStatus = getLatest(c.clm.creation);
          }
        }
        const vendorDisp = c.vendorNameBase === 'Other' ? (c.vendorNameOther || 'Other') : (c.vendorNameBase || '—');
        const monitoringCount = c.vendorMonitoring ? c.vendorMonitoring.length : 0;

        return `<tr style="${isActive ? 'background:var(--input-bg)' : ''}; cursor:pointer" data-act="sel-contract" data-id="${c.createdAt}">
            <td><span class="mono-font" style="color:var(--accent);font-weight:700">${c.reportNo || '—'}</span></td>
            <td>${c.title || '—'}</td>
            <td>${c.maintenanceType || '—'}</td>
            <td>${c.issuedGroup || '—'}</td>
            <td>${vendorDisp}</td>
            <td>${fmtDate(c)}</td>
            <td>${c.ecd ? fmtDate({ happeningDate: c.ecd }) : '—'}</td>
            <td style="text-align:center;font-weight:700;color:var(--ink-light)">${monitoringCount}</td>
            <td><span class="status-chip chip-open">${latestStatus}</span></td>
        </tr>`;
      }).join('');

      const listSec = `<div class="sec" style="margin-top:20px"><div class="sec-title">Contract List</div>
          <div class="table-panel" style="padding:0;border:none">
              ${contracts.length === 0 ? `<div class="empty-state">No records found. Create one in Record Input.</div>` :
              `<table class="list"><thead><tr><th>Record No.</th><th>Title</th><th>Classification</th><th>Criteria</th><th>Vendor</th><th>Date Issued</th><th>CPCD</th><th>Monitoring</th><th>CLM Status</th></tr></thead><tbody>${rows}</tbody></table>`}
          </div>
      </div>`;

      let clmSec = '';
      if (r) {
        const clm = r.clm || { creation: [{}], negotiations: [{}], approval: [{}], monitoring: {}, renewal: {} };
        if (!Array.isArray(clm.creation)) clm.creation = [clm.creation || {}];
        if (!Array.isArray(clm.approval)) clm.approval = [clm.approval || {}];

        const clmRow = (label, key, idx, obj, phOwner, statusOpts, phRemarks) => {
          const pathBase = "clm." + key + (idx !== null ? "." + idx : "");
          const selOpts = `<option value=""></option>` + statusOpts.map(opt => `<option value="${opt}" ${obj.status === opt ? 'selected' : ''}>${opt}</option>`).join('');

          let actionBtns = '';
          if (idx !== null) {
            if (idx === 0) actionBtns += `<br><button class="link-btn" data-act="add-clm" data-key="${key}" style="font-size:10px;padding:4px 0 0;text-decoration:underline">✚ Add Detail</button>`;
            if (idx > 0) actionBtns += `<br><button class="link-btn" data-act="rem-clm" data-key="${key}" data-idx="${idx}" style="font-size:10px;padding:4px 0 0;color:var(--crit);text-decoration:underline">✖ Remove</button>`;
          }

          let statusStyle = 'width:100%;font-size:.75rem;padding:7px 4px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg)';
          if (r.urgency && r.happeningDate && obj.status) {
            let maxDays = null;
            const urgMap = {
              '1month': { 'creation': { 'Initial Draft': 5, 'In Progress': 10, 'Draft Finalized': 12 }, 'negotiations': { 'Pending': 18, 'Agreed': 23 }, 'approval': { 'Hold': 28, 'Signed': 28 } },
              '3months': { 'creation': { 'Initial Draft': 14, 'In Progress': 28, 'Draft Finalized': 35 }, 'negotiations': { 'Pending': 56, 'Agreed': 70 }, 'approval': { 'Hold': 84, 'Signed': 84 } },
              '6months': { 'creation': { 'Initial Draft': 30, 'In Progress': 60, 'Draft Finalized': 75 }, 'negotiations': { 'Pending': 120, 'Agreed': 150 }, 'approval': { 'Hold': 180, 'Signed': 180 } },
              '12months': { 'creation': { 'Initial Draft': 60, 'In Progress': 120, 'Draft Finalized': 152 }, 'negotiations': { 'Pending': 242, 'Agreed': 304 }, 'approval': { 'Hold': 365, 'Signed': 365 } }
            };
            if (urgMap[r.urgency] && urgMap[r.urgency][key] && urgMap[r.urgency][key][obj.status]) {
              maxDays = urgMap[r.urgency][key][obj.status];
            }
            if (maxDays !== null) {
              const baseTs = new Date(r.happeningDate).getTime();
              if (!isNaN(baseTs)) {
                const deadlineTs = baseTs + (maxDays * 86400000);
                const evalTs = obj.date ? new Date(obj.date).getTime() : Date.now();
                const diffDays = (deadlineTs - evalTs) / 86400000;
                if (diffDays < 0) statusStyle = 'width:100%;font-size:.75rem;padding:7px 4px;border:1px solid var(--crit);border-radius:7px;background:#fef2f2;color:var(--crit);font-weight:bold;';
                else if (diffDays <= 3) statusStyle = 'width:100%;font-size:.75rem;padding:7px 4px;border:1px solid var(--warn);border-radius:7px;background:#fffbeb;color:var(--warn);font-weight:bold;';
              }
            }
          }

          return `
          <tr>
              <td style="font-size:.7rem;font-weight:700;color:var(--ink);vertical-align:top;padding-top:12px">
                  ${label}
                  ${actionBtns}
              </td>
              <td><input type="date" data-path="${pathBase}.date" value="${obj.date || ''}"/></td>
              <td><input type="text" data-path="${pathBase}.owner" value="${obj.owner || ''}" placeholder="${phOwner}"/></td>
              <td><select data-path="${pathBase}.status" style="${statusStyle}">${selOpts}</select></td>
              <td><input type="text" data-path="${pathBase}.remarks" value="${obj.remarks || ''}" placeholder="${phRemarks}"/></td>
          </tr>`;
        };

        let clmHtml = '';
        clm.creation.forEach((cre, i) => { clmHtml += clmRow(i === 0 ? '1. Creation (Drafting/Authoring)' : '', 'creation', i, cre, 'Author/Drafter', ['Initial Draft', 'In Progress', 'Draft Finalized'], 'Doc Ref...'); });
        clm.negotiations.forEach((neg, i) => { clmHtml += clmRow(i === 0 ? '2. Negotiation & Collaboration' : '', 'negotiations', i, neg, 'Reviewer/Legal', ['Pending', 'Agreed'], 'Iteration Notes...'); });
        clm.approval.forEach((app, i) => { clmHtml += clmRow(i === 0 ? '3. Approval & Signature (Execution)' : '', 'approval', i, app, 'Signatory', ['Signed', 'Hold'], 'Execution Details...'); });

        if (r.vendorMonitoring && r.vendorMonitoring.length > 0) {
          r.vendorMonitoring.forEach((hist, idx) => {
            const label = idx === 0 ? '4. Monitoring & Management' : '';
            const hasNotMet = hist.metrics && hist.metrics.some(m => m.status === 'Not Met');
            const calcStatus = hasNotMet ? 'Breach' : 'Active';
            const pics = [...new Set((hist.metrics || []).map(m => m.pic).filter(x => x && x.trim() !== ''))].join(', ').replace(/"/g, '&quot;');
            const remarks = [...new Set((hist.metrics || []).map(m => m.remarks).filter(x => x && x.trim() !== ''))].join(' | ').replace(/"/g, '&quot;');

            clmHtml += `
            <tr>
                <td style="font-size:.7rem;font-weight:700;color:var(--ink);vertical-align:top;padding-top:12px">${label}</td>
                <td><input type="date" value="${hist.date || ''}" readonly style="background:var(--line);cursor:not-allowed" /></td>
                <td><input type="text" value="${pics}" readonly style="background:var(--line);cursor:not-allowed" title="${pics}" placeholder="No PIC"/></td>
                <td><input type="text" value="${calcStatus}" readonly style="width:100%;font-size:.75rem;padding:7px 4px;border:1px solid var(--line);border-radius:7px;background:var(--line);color:${calcStatus === 'Breach' ? 'var(--crit)' : 'var(--ok)'};font-weight:bold;cursor:not-allowed"/></td>
                <td><input type="text" value="${remarks}" readonly style="background:var(--line);cursor:not-allowed" title="${remarks}" placeholder="No Remarks"/></td>
            </tr>`;
          });
        } else {
          clmHtml += `
          <tr>
              <td style="font-size:.7rem;font-weight:700;color:var(--ink);vertical-align:top;padding-top:12px">4. Monitoring &amp; Management</td>
              <td><input type="date" readonly style="background:var(--line);cursor:not-allowed"/></td>
              <td><input type="text" placeholder="Auto-pulled from Vendor Mgt" readonly style="background:var(--line);cursor:not-allowed"/></td>
              <td><input type="text" placeholder="Auto-status" readonly style="width:100%;font-size:.75rem;padding:7px 4px;border:1px solid var(--line);border-radius:7px;background:var(--line);cursor:not-allowed"/></td>
              <td><input type="text" placeholder="Auto-pulled from Vendor Mgt" readonly style="background:var(--line);cursor:not-allowed"/></td>
          </tr>`;
        }

        clmHtml += clmRow('5. Renewal or Termination', 'renewal', null, clm.renewal, 'Action Owner', ['Renewed', 'Terminated', 'Expired'], 'Notice Terms...');

        const tableDisplay = state.contractClmTableVisible ? 'table' : 'none';
        const toggleBtnText = state.contractClmTableVisible ? 'Hide Table' : 'Table';

        clmSec = `<div class="sec">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div class="sec-title" style="margin:0">Contract Lifecycle Management (CLM) - ${r.reportNo}</div>
                <div style="display:flex; gap: 8px;">
                    <button class="btn btn-ghost" id="contract-toggle-table-btn" style="padding:4px 10px;font-size:.75rem">${toggleBtnText}</button>
                    <button class="btn btn-primary" id="clm-submit-btn" style="background:var(--ok);padding:4px 10px;font-size:.75rem">Save CLM Updates ✔</button>
                </div>
            </div>
            <div class="grid g4" style="margin-bottom:14px">
                ${field('Contract Preparation Completion Date (CPCD)', 'ecd', r.ecd, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Contract Duration', 'contractDuration', r.contractDuration, 'text', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Start Date', 'startDate', r.startDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('End Date', 'endDate', r.endDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
            </div>
            <table class="editrows" style="display:${tableDisplay}">
              <thead>
                <tr>
                  <th style="width:24%">CLM Stage</th>
                  <th style="width:14%">Date</th>
                  <th style="width:18%">PIC / Owner</th>
                  <th style="width:16%">Status / Outcome</th>
                  <th style="width:28%">Remarks / Details</th>
                </tr>
              </thead>
              <tbody>${clmHtml}</tbody>
            </table>
        </div>`;
      }

      container.innerHTML = `<div class="form-shell">${listSec}${clmSec}</div>`;

      container.querySelectorAll('[data-act="sel-contract"]').forEach(row => {
        row.addEventListener('click', () => {
          state.activeId = String(row.getAttribute('data-id'));
          render();
        });
      });

      if (r) {
        const toggleBtn = container.querySelector('#contract-toggle-table-btn');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {

        container.querySelector('#clm-submit-btn').addEventListener('click', async () => {

            btn.style.pointerEvents = 'auto';
          }
        });
      }
    }

    /* =========================================================================
       VENDOR MANAGEMENT MODULE
       ========================================================================= */
    function renderVendorManagement(container) {
      const vendors = state.records.filter(r => !r.isDraft && r.maintenanceType === 'Vendor Management').sort((a, b) => b.createdAt - a.createdAt);
      let r = state.records.find(x => String(x.createdAt) === String(state.activeId));
      if (!r || r.maintenanceType !== 'Vendor Management') {
        r = vendors.length ? vendors[0] : null;
        if (r) state.activeId = String(r.createdAt);
      }

      const rows = vendors.map(c => {
        const isActive = r && String(c.createdAt) === String(r.createdAt);
        let latestStatus = 'Pending';
        let monitoringCount = c.vendorMonitoring ? c.vendorMonitoring.length : 0;
        let refDateStr = monitoringCount > 0 ? c.vendorMonitoring[c.vendorMonitoring.length - 1].date : c.startDate;
        let needsAttention = false;

        if (refDateStr) {
          let refDate = new Date(refDateStr);
          if (!isNaN(refDate.getTime())) {
            let limitDate = new Date(refDate);
            limitDate.setMonth(limitDate.getMonth() + 3);
            if (Date.now() > limitDate.getTime()) needsAttention = true;
          }
        }

        if (needsAttention) latestStatus = 'Need Attention';
        else if (monitoringCount === 0) latestStatus = 'Pending';
        else {
          let hasNotMet = c.vendorMonitoring.some(hist => hist.metrics && hist.metrics.some(m => m.status === 'Not Met'));
          latestStatus = hasNotMet ? 'Not Met' : 'Met';
        }

        let chipClass = 'chip-open';
        if (latestStatus === 'Need Attention') chipClass = 'chip-progress';
        else if (latestStatus === 'Met') chipClass = 'chip-done';
        else if (latestStatus === 'Not Met') chipClass = 'chip-crit';

        const vendorDisp = c.vendorNameBase === 'Other' ? (c.vendorNameOther || 'Other') : (c.vendorNameBase || '—');

        return `<tr style="${isActive ? 'background:var(--input-bg)' : ''}; cursor:pointer" data-act="sel-vendor" data-id="${c.createdAt}">
            <td><span class="mono-font" style="color:var(--accent);font-weight:700">${c.reportNo || '—'}</span></td>
            <td>${c.title || '—'}</td>
            <td>${c.issuedGroup || '—'}</td>
            <td>${vendorDisp}</td>
            <td>${c.startDate ? fmtDate({ happeningDate: c.startDate }) : '—'}</td>
            <td>${c.endDate ? fmtDate({ happeningDate: c.endDate }) : '—'}</td>
            <td style="text-align:center;font-weight:700;color:var(--ink-light)">${monitoringCount}</td>
            <td><span class="status-chip ${chipClass}">${latestStatus}</span></td>
        </tr>`;
      }).join('');

      const listSec = `<div class="sec" style="margin-top:20px"><div class="sec-title">Vendor List</div>
          <div class="table-panel" style="padding:0;border:none">
              ${vendors.length === 0 ? `<div class="empty-state">No Vendor Management records found. Create one in Record Input.</div>` :
              `<table class="list"><thead><tr><th>Record No.</th><th>Title</th><th>Criteria</th><th>Vendor</th><th>Start Date</th><th>End Date</th><th>Monitoring</th><th>SLA Status</th></tr></thead><tbody>${rows}</tbody></table>`}
          </div>
      </div>`;

      let slaSec = '';
      let monitorHistorySec = '';
      if (r) {
        if (!r.vendorSla || !Array.isArray(r.vendorSla)) r.vendorSla = Array.from({ length: 6 }, () => ({ actual: '', status: '', pic: '', remarks: '' }));

        const slaHtml = SLA_METRICS.map((m, i) => {
          const v = r.vendorSla[i] || { actual: '', status: '', pic: '', remarks: '' };
          return `<tr>
              <td style="font-weight:700;color:var(--ink);vertical-align:top;padding-top:8px">${m.type}</td>
              <td style="font-weight:700;vertical-align:top;padding-top:8px">${m.name}</td>
              <td style="font-size:10px;vertical-align:top;padding-top:8px"><b>Target:</b> ${m.target}<br><span style="color:var(--text-sec)"><b>Measure:</b> ${m.measure}</span></td>
              <td style="vertical-align:top"><textarea data-path="vendorSla.${i}.actual" placeholder="Enter actual results..." style="min-height:48px">${v.actual || ''}</textarea></td>
              <td style="vertical-align:top"><select data-path="vendorSla.${i}.status" style="width:100%;padding:6px;font-size:11px"><option value=""></option><option value="Met" ${v.status === 'Met' ? 'selected' : ''}>Met</option><option value="Not Met" ${v.status === 'Not Met' ? 'selected' : ''}>Not Met</option><option value="N/A" ${v.status === 'N/A' ? 'selected' : ''}>N/A</option></select></td>
              <td style="vertical-align:top"><input type="text" data-path="vendorSla.${i}.pic" value="${v.pic || ''}" placeholder="Name..." style="width:100%;font-size:11px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg)"/></td>
              <td style="vertical-align:top"><textarea data-path="vendorSla.${i}.remarks" placeholder="Remarks..." style="min-height:48px">${v.remarks || ''}</textarea></td>
          </tr>`;
        }).join('');

        const tableDisplay = state.vendorSlaTableVisible ? 'table' : 'none';
        const toggleBtnText = state.vendorSlaTableVisible ? 'Hide Table' : 'Table';

        slaSec = `<div class="sec">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div class="sec-title" style="margin:0">Service Level Agreement (SLA) &amp; Key Performance Indicator (KPI) - ${r.reportNo}</div>
                <div style="display:flex; gap: 8px;">
                    <button class="btn btn-ghost" id="vendor-toggle-table-btn" style="padding:4px 10px;font-size:.75rem">${toggleBtnText}</button>
                    <button class="btn btn-primary" id="vendor-submit-btn" style="background:var(--ok);padding:4px 10px;font-size:.75rem">Save SLA Updates ✔</button>
                </div>
            </div>
            <div class="grid g4" style="margin-bottom:14px">
                ${field('Contract Duration', 'contractDuration', r.contractDuration, 'text', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Start Date', 'startDate', r.startDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('End Date', 'endDate', r.endDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
            </div>
            <table class="editrows" style="margin-bottom:12px; display:${tableDisplay}">
              <thead>
                <tr>
                  <th style="width:10%">Metric Type</th>
                  <th style="width:14%">Metric Name</th>
                  <th style="width:25%">Target / Measurement</th>
                  <th style="width:18%">Actual Performance</th>
                  <th style="width:9%">Status</th>
                  <th style="width:12%">PIC / Owner</th>
                  <th style="width:12%">Remarks</th>
                </tr>
              </thead>
              <tbody>${slaHtml}</tbody>
            </table>
            <div style="display:${state.vendorSlaTableVisible ? 'flex' : 'none'};justify-content:flex-end;">
               <button class="btn btn-primary" id="vendor-add-monitor-btn" style="padding:4px 10px;font-size:.75rem">✚ Add Monitoring</button>
            </div>
        </div>`;

        if (r.vendorMonitoring && r.vendorMonitoring.length > 0) {
          const histHtml = r.vendorMonitoring.slice().reverse().map((hist, i) => {
            const origIdx = r.vendorMonitoring.length - 1 - i;
            return `
            <div style="margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;">
              <div style="background: var(--line); padding: 8px 12px; font-weight: 700; font-size: .85rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;">
                <span>Date: ${hist.date ? fmtDate({ happeningDate: hist.date }) : '—'}</span>
                <div style="display:flex; gap: 6px;">
                    <button class="btn btn-ghost" data-act="edit-monitor" data-idx="${origIdx}" style="padding: 2px 8px; font-size: .65rem; background: var(--paper);">Edit</button>
                    <button class="btn btn-danger" data-act="del-monitor" data-idx="${origIdx}" style="padding: 2px 8px; font-size: .65rem;">Delete</button>
                </div>
              </div>
              <table class="list" style="margin: 0; width: 100%;">
                <thead>
                  <tr>
                    <th style="width:24%">Metric</th>
                    <th style="width:26%">Actual Performance</th>
                    <th style="width:10%">Status</th>
                    <th style="width:15%">PIC / Owner</th>
                    <th style="width:25%">Remarks</th>
                  </tr>
                </thead>
                <tbody>
                  ${hist.metrics.map((m, idx) => `
                    <tr>
                      <td><b>${SLA_METRICS[idx].name}</b></td>
                      <td>${m.actual || '—'}</td>
                      <td><span class="status-chip ${m.status === 'Met' ? 'chip-done' : m.status === 'Not Met' ? 'chip-progress' : 'chip-open'}">${m.status || '—'}</span></td>
                      <td>${m.pic || '—'}</td>
                      <td>${m.remarks || '—'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`;
          }).join('');

          monitorHistorySec = `<div class="sec"><div class="sec-title">Monitoring History</div>${histHtml}</div>`;
        } else {
          monitorHistorySec = `<div class="sec"><div class="sec-title">Monitoring History</div><div class="empty-state" style="padding:16px 0">No monitoring history available.</div></div>`;
        }
      }

      container.innerHTML = `<div class="form-shell">${listSec}${slaSec}${monitorHistorySec}</div>`;

      container.querySelectorAll('[data-act="sel-vendor"]').forEach(row => {
        row.addEventListener('click', () => {
          state.activeId = String(row.getAttribute('data-id'));
          render();
        });
      });

      if (r) {
        const toggleBtn = container.querySelector('#vendor-toggle-table-btn');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            state.vendorSlaTableVisible = !state.vendorSlaTableVisible;
            render();
          });
        }

        container.querySelectorAll('[data-act="del-monitor"]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const idx = parseInt(btn.getAttribute('data-idx'));
            const confirm = await showModal("Confirm Deletion", "Are you sure you want to delete this monitoring record?", "confirm");
            if (confirm) {
              r.vendorMonitoring.splice(idx, 1);
              state.isDirty = true;
              saveRecords();
              render();
            }
          });
        });

        container.querySelectorAll('[data-act="edit-monitor"]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const idx = parseInt(btn.getAttribute('data-idx'));
            const confirm = await showModal("Edit Monitoring", "Load this record into the input table? (It will be removed from history until you click '+ Add Monitoring' again)", "confirm-edit");
            if (confirm) {
              state.editMonitorDate = r.vendorMonitoring[idx].date;
              r.vendorSla = JSON.parse(JSON.stringify(r.vendorMonitoring[idx].metrics));
              r.vendorMonitoring.splice(idx, 1);
              state.vendorSlaTableVisible = true;
              state.isDirty = true;
              saveRecords();
              render();
            }
          });
        });

        container.querySelectorAll('[data-path]').forEach(el => {
          if (el.tagName !== 'SELECT' && el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
          el.addEventListener('input', () => {
            state.isDirty = true;
            setByPath(r, el.getAttribute('data-path'), el.value);
            saveRecords();
          });
        });

        container.querySelector('#vendor-submit-btn').addEventListener('click', async () => {
          state.isDirty = false;
          state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
          saveRecords();
          const btn = container.querySelector('#vendor-submit-btn'), ogTxt = btn.innerHTML;
          btn.innerHTML = 'Saving ⏳';
          btn.style.pointerEvents = 'none';
          try {
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ payload: JSON.stringify(r) }) });
            setTimeout(async () => { await showModal("Success", "Vendor SLA updates saved to Google Sheets!", "alert"); render(); }, 1000);
          } catch (e) {
            console.error(e);
            await showModal("Error", "Saved locally.", "alert", true);
            btn.innerHTML = ogTxt;
            btn.style.pointerEvents = 'auto';
          }
        });

        container.querySelector('#vendor-add-monitor-btn').addEventListener('click', async () => {
          let valid = true;
          for (let i = 0; i < 6; i++) {
            const actualEl = container.querySelector(`[data-path="vendorSla.${i}.actual"]`);
            const statusEl = container.querySelector(`[data-path="vendorSla.${i}.status"]`);
            if (actualEl && statusEl) {
              actualEl.classList.remove('err-highlight');
              statusEl.classList.remove('err-highlight');
              if (!r.vendorSla[i].actual || r.vendorSla[i].actual.trim() === '') {
                actualEl.classList.add('err-highlight');
                valid = false;
              }
              if (!r.vendorSla[i].status || r.vendorSla[i].status.trim() === '') {
                statusEl.classList.add('err-highlight');
                valid = false;
              }
            }
          }
          if (!valid) {
            state.vendorSlaTableVisible = true;
            render();
            setTimeout(async () => {
              await showModal("Validation Error", "Please fill in Actual Performance and Status for all metrics.", "alert", true);
            }, 50);
            return;
          }
          const defaultDate = state.editMonitorDate || '';
          const mDate = await showModal("Monitoring Date", "Select the date for this monitoring record:", "prompt-date", defaultDate);
          if (!mDate) return;

          await showModal("Success", `Monitoring record for ${mDate} added to history.`, "alert");
          if (!r.vendorMonitoring) r.vendorMonitoring = [];
          r.vendorMonitoring.push({ date: mDate, metrics: JSON.parse(JSON.stringify(r.vendorSla)) });
          r.vendorSla = Array.from({ length: 6 }, () => ({ actual: '', status: '', pic: '', remarks: '' }));

          state.editMonitorDate = null;
          state.vendorSlaTableVisible = false;
          state.isDirty = true;
          saveRecords();
          render();
        });
      }
    }

      /* Compute Headcount KPIs dynamically from the rendered org nodes */
      function updateOrgKPIs() {
        const nodes = canvasEl ? Array.from(canvasEl.querySelectorAll('.org-person-card')) : [];
        const total = nodes.length;
        const vacant = nodes.filter(n => n.getAttribute('data-role') === 'vacant').length;
        const filled = total - vacant;
        const fillRate = total > 0 ? Math.round((filled / total) * 100) : 0;

        const kpiCards = [
          { l: 'Total Establishment', v: total, c: 'var(--accent)', s: `${curPageObj.short}`, p: `<span class="kpi-pill pill-ok">Approved slots</span>` },
          { l: 'Filled Positions', v: filled, c: 'var(--ok)', s: `Active personnel assigned`, p: `<span class="kpi-pill pill-ok">On duty</span>` },
          { l: 'Vacant Positions', v: vacant, c: 'var(--crit)', s: `Open positions to fill`, p: vacant > 0 ? `<span class="kpi-pill pill-crit">Needs hiring</span>` : `<span class="kpi-pill pill-ok">100% staffed</span>` },
          { l: 'Manning Rate', v: fillRate + '%', c: fillRate >= 85 ? 'var(--ok)' : 'var(--warn)', s: `${filled} of ${total} slots filled`, p: fillRate >= 85 ? `<span class="kpi-pill pill-ok">Healthy</span>` : `<span class="kpi-pill pill-warn">Below 85%</span>` },
          { l: 'Active Chart View', v: `Page ${state.orgPage} / 6`, c: 'var(--accent-2)', s: curPageObj.title, p: `<span class="kpi-pill pill-ok">Interactive</span>` }
        ];

        const kpiGrid = container.querySelector('#org-kpi-grid');
        if (kpiGrid) {
          kpiGrid.innerHTML = kpiCards.map(c => `<div class="kpi-card"><div class="bar" style="background:${c.c}"></div><div class="kpi-label">${c.l}</div><div class="kpi-value">${c.v}</div><div class="kpi-sub">${c.s}</div>${c.p}</div>`).join('');
        }
      }

      /* Apply Search & Role Filtering Highlights */
      function applyOrgFilters() {
        if (!canvasEl) return;
        const q = (state.orgSearch || '').trim().toLowerCase();
        const roleF = state.orgRoleFilter || 'ALL';
        const clearBtn = container.querySelector('#org-search-clear');
        const matchEl = container.querySelector('#org-match-count');
        if (clearBtn) clearBtn.style.display = q.length > 0 ? 'block' : 'none';

        const cards = Array.from(canvasEl.querySelectorAll('.org-person-card'));
        let matches = 0;
        const filteringActive = q.length > 0 || roleF !== 'ALL';

        cards.forEach(card => {
          card.classList.remove('org-dimmed', 'org-highlighted');
          if (!filteringActive) return;

          const txt = (card.textContent || '').toLowerCase();
          const dept = (card.getAttribute('data-dept') || '').toLowerCase();
          const role = card.getAttribute('data-role') || '';

          const matchText = !q || txt.includes(q) || dept.includes(q);
          const matchRole = roleF === 'ALL' || role === roleF;

          if (matchText && matchRole) {
            card.classList.add('org-highlighted');
            matches++;
          } else {
            card.classList.add('org-dimmed');
          }
        });

        if (matchEl) {
          matchEl.textContent = filteringActive ? `${matches} match${matches === 1 ? '' : 'es'}` : '';
        }
      }

      /* Responsive Auto-Fit & Zoom Sizing */
      function applyOrgScale() {
        if (!viewportEl || !stageEl) return;
        const availW = Math.max(320, viewportEl.clientWidth - 28);
        let scale = state.orgZoomLevel;
        if (state.orgZoomMode === 'fit') {
          scale = Math.min(1, availW / 1280);
          state.orgZoomLevel = scale;
        }
        stageEl.style.transform = `scale(${scale})`;
        stageEl.style.width = '1280px';
        stageEl.style.height = '720px';
        viewportEl.style.height = Math.round(720 * scale + 28) + 'px';
      }

      updateOrgKPIs();
      applyOrgFilters();
      setTimeout(applyOrgScale, 0);
      window.addEventListener('resize', applyOrgScale, { once: true });

      /* Page Switching */
      container.querySelectorAll('[data-org-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.orgPage = Number(btn.getAttribute('data-org-page'));
          render();
        });
      });

      const prevBtn = container.querySelector('#org-prev-btn');
      if (prevBtn && state.orgPage > 1) {
        prevBtn.addEventListener('click', () => { state.orgPage--; render(); });
      }
      const nextBtn = container.querySelector('#org-next-btn');
      if (nextBtn && state.orgPage < 6) {
        nextBtn.addEventListener('click', () => { state.orgPage++; render(); });
      }

      /* Zoom Controls */
      container.querySelector('#org-zoom-in').addEventListener('click', () => {
        state.orgZoomMode = 'manual';
        state.orgZoomLevel = Math.min(1.5, +(state.orgZoomLevel + 0.12).toFixed(2));
        container.querySelector('#org-zoom-fit').textContent = 'Fit';
        applyOrgScale();
      });
      container.querySelector('#org-zoom-out').addEventListener('click', () => {
        state.orgZoomMode = 'manual';
        state.orgZoomLevel = Math.max(0.45, +(state.orgZoomLevel - 0.12).toFixed(2));
        container.querySelector('#org-zoom-fit').textContent = 'Fit';
        applyOrgScale();
      });
      container.querySelector('#org-zoom-fit').addEventListener('click', () => {
        state.orgZoomMode = 'fit';
        container.querySelector('#org-zoom-fit').textContent = 'Fit ✓';
        applyOrgScale();
      });

      /* Role Filter Pills */
      container.querySelectorAll('[data-role-filter]').forEach(pill => {
        pill.addEventListener('click', () => {
          const key = pill.getAttribute('data-role-filter');
          state.orgRoleFilter = (state.orgRoleFilter === key && key !== 'ALL') ? 'ALL' : key;
          container.querySelectorAll('[data-role-filter]').forEach(p => {
            p.classList.toggle('active', p.getAttribute('data-role-filter') === state.orgRoleFilter);
          });
          applyOrgFilters();
        });
      });

      /* Search Input */
      const searchInput = container.querySelector('#org-search-input');
      const searchClear = container.querySelector('#org-search-clear');
      searchInput.addEventListener('input', () => {
        state.orgSearch = searchInput.value;
        applyOrgFilters();
      });
      searchClear.addEventListener('click', () => {
        state.orgSearch = '';
        searchInput.value = '';
        applyOrgFilters();
        searchInput.focus();
      });

      /* Click-to-Inspect Personnel Node */
      if (canvasEl) {
        canvasEl.querySelectorAll('.org-person-card').forEach(card => {
          card.addEventListener('click', (e) => {
            e.stopPropagation();
            const nameEl = card.querySelector('.name');
            const titleEl = card.querySelector('.title');
            const rawName = nameEl ? nameEl.innerText.replace(/\n/g, ' ') : 'Position';
            const rawTitle = titleEl ? titleEl.innerText.replace(/\n/g, ' — ') : '';
            const dept = card.getAttribute('data-dept') || curPageObj.title;
            const role = card.getAttribute('data-role') || 'staff';
            const roleLabels = {
              manager: 'Manager (Terminal 1)',
              srexec: 'Senior Executive Engineer',
              exec: 'Executive Engineer',
              techoff: 'Technical Officer / Chargeman',
              specialist: 'Specialist',
              technician: 'Technician',
              vacant: 'Vacant Position (Open Slot)'
            };
            const statusTxt = role === 'vacant' ? 'VACANT — Open Establishment Slot' : 'ACTIVE — Assigned Personnel';
            const detailBody =
              `Personnel: ${rawName}\n` +
              (rawTitle ? `Designation: ${rawTitle}\n` : '') +
              `Position Level: ${roleLabels[role] || 'Operations Staff'}\n` +
              `Section / Shift: ${dept}\n` +
              `Chart View: ${curPageObj.short}\n` +
              `Status: ${statusTxt}`;
            showModal('Personnel & Position Details', detailBody, 'alert', role === 'vacant');
          });
        });
      }

      /* Drag-to-Pan in Viewport */
      let isPanning = false, panStartX = 0, panStartY = 0, panScrollL = 0, panScrollT = 0;
      viewportEl.addEventListener('mousedown', e => {
        if (e.target.closest('.org-person-card')) return;
        isPanning = true;
        panStartX = e.pageX - viewportEl.offsetLeft;
        panStartY = e.pageY - viewportEl.offsetTop;
        panScrollL = viewportEl.scrollLeft;
        panScrollT = viewportEl.scrollTop;
      });
      viewportEl.addEventListener('mouseleave', () => { isPanning = false; });
      viewportEl.addEventListener('mouseup', () => { isPanning = false; });
      viewportEl.addEventListener('mousemove', e => {
        if (!isPanning) return;
        e.preventDefault();
        const x = e.pageX - viewportEl.offsetLeft;
        const y = e.pageY - viewportEl.offsetTop;
        viewportEl.scrollLeft = panScrollL - (x - panStartX);
        viewportEl.scrollTop = panScrollT - (y - panStartY);
      });

      /* Export JPEG Helper */
      const exportOrgCanvas = (targetCanvas, fileName) => {
        if (typeof html2canvas === 'undefined') {
          showModal('Notice', 'Export library is still loading. Please try again in a moment.', 'alert', true);
          return;
        }
        html2canvas(targetCanvas, { scale: 2, backgroundColor: '#f8fafc', width: 1280, height: 720 }).then(canvas => {
          const link = document.createElement('a');
          link.href = canvas.toDataURL('image/jpeg', 0.98);
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        });
      };

      container.querySelector('#org-export-jpg').addEventListener('click', () => {
        exportOrgCanvas(canvasEl, `BHS_Org_Chart_Page_${state.orgPage}.jpg`);
      });

      /* Full Screen View Overlay */
      const fvOverlay = container.querySelector('#org-fullview-overlay');
      const fvStage = container.querySelector('#org-fv-stage');
      const fvWrap = container.querySelector('#org-fv-stage-wrap');

      container.querySelector('#org-fullview-btn').addEventListener('click', () => {
        fvOverlay.style.display = 'flex';
        fvStage.innerHTML = getOrgPageMarkup(state.orgPage);
        const fvCanvas = fvStage.querySelector('.org-canvas');
        if (fvCanvas) fvCanvas.id = 'org-canvas-fv';
        const wScale = Math.min((fvWrap.clientWidth - 32) / 1280, (fvWrap.clientHeight - 32) / 720, 1.15);
        fvStage.style.width = '1280px';
        fvStage.style.height = '720px';
        fvStage.style.transform = `scale(${Math.max(0.5, wScale)})`;
      });

      container.querySelector('#org-fv-close-btn').addEventListener('click', () => {
        fvOverlay.style.display = 'none';
      });

      container.querySelector('#org-fv-export-btn').addEventListener('click', () => {
        const fvCanvas = fvStage.querySelector('.org-canvas');
        if (fvCanvas) exportOrgCanvas(fvCanvas, `BHS_Org_Chart_Page_${state.orgPage}_FullView.jpg`);
      });

      container.querySelectorAll('[data-fv-org-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.orgPage = Number(btn.getAttribute('data-fv-org-page'));
          render();
          setTimeout(() => {
            const openBtn = document.getElementById('org-fullview-btn');
            if (openBtn) openBtn.click();
          }, 20);
        });
      });
    }

    /* =========================================================================
       UTILITIES & MAIN APPLICATION RENDERER
       ========================================================================= */
    function setByPath(obj, path, value) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        cur = cur[isFinite(parts[i]) ? Number(parts[i]) : parts[i]];
      }
      cur[parts[parts.length - 1]] = value;
    }

    function renderBlank(container, title) {
      container.innerHTML = `<div class="panel" style="min-height:400px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line-dark); background:transparent;"><div class="empty-state" style="font-size:1.1rem; color:var(--text-sec); font-weight:600">The <b>${title}</b> module is currently blank and under development.</div></div>`;
    }

    function render() {
      ROOT.innerHTML = `<div class="wrap"><div class="topbar"><div class="brand"><div class="k">KLIA - Baggage Handling System T1</div><div class="t">BHS Maintenance : Resource Management Monitoring</div></div><div class="tabs">${ALL_TABS.map(t => `<button class="tab-btn ${state.tab === t ? 'active' : ''}" data-tab="${t}">${t}</button>`).join('')}</div></div><div id="acm-content"></div></div>`;
      ROOT.querySelectorAll('.tab-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const targetTab = b.getAttribute('data-tab');
          if (state.tab === 'Record Input' && targetTab !== 'Record Input' && state.isDirty) {
            const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved");
            if (!discard) return;
            revertActiveRecord();
          }
          state.tab = targetTab;
          render();
        });
      });

      const content = document.getElementById('acm-content');
      if (!state.loaded) {
        content.innerHTML = `<div class="empty-state">Loading records…</div>`;
        return;
      }

      if (state.tab === 'Dashboard') renderDashboard(content);
      else if (state.tab === 'Record Input') renderInput(content);
      else if (state.tab === 'Manpower Management') renderManpowerManagement(content);
      else if (state.tab === 'Contract Management') renderContractManagement(content);
      else if (state.tab === 'Vendor Management') renderVendorManagement(content);
      else if (BLANK_TABS.includes(state.tab)) renderBlank(content, state.tab);
    }

    render();
    loadRecords();
  })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
