<style>
  #acm-root,#acm-root *{box-sizing:border-box}
  #acm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100%;font-size:.875rem;line-height:1.4;position:relative}

  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g1{grid-template-columns:1fr}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}

  #acm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #acm-root input[type=text],#acm-root input[type=date],#acm-root input[type=time],#acm-root input[type=number],#acm-root textarea,#acm-root select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s}
  #acm-root select[multiple]{padding:4px 6px}
  #acm-root textarea{resize:vertical;min-height:54px}
  #acm-root .check-row,#acm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #acm-root .chk,#acm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}

  #acm-root table.editrows{width:100%;border-collapse:collapse;margin-top:6px}
  #acm-root table.editrows input{width:100%;font-size:.75rem}
  #acm-root .err-highlight,#acm-root .err-sec{border:1px solid var(--crit)!important;background-color:#fef2f2!important;box-shadow:0 0 0 1px var(--crit)}
  #acm-root #acm-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #acm-root #acm-modal-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:90%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(12px);transition:transform .2s ease}
  #acm-root #acm-modal-overlay.active #acm-modal-box{transform:translateY(0)}
  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}

<body>
<div id="acm-root"></div>
<script>
(function () {
  const ROOT = document.getElementById('acm-root');
  const STORE_KEY = 'acm-records-v1';
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzdN6zevwwWW0QfnSXnHCAt5dXFv8NzDyq1nGNCMb_ogxo8zFeADGnFFDmuGxM5Hk/exec";
  const COMPRESSED_DB = {}; 
  const EQUIP_DB = {};
  for(const line in COMPRESSED_DB){
    EQUIP_DB[line]={};
    for(const desc in COMPRESSED_DB[line]){
      COMPRESSED_DB[line][desc].forEach(no=>{EQUIP_DB[line][no]=desc;});
    }
  }
  const CONF_PASS = {'Anisah':'134510','Azlan':'111306','Eylia':'131091','Fairus':'123092','Fariz':'134828','Hafizah':'134449','Khairoulnizam':'110143','Samsulnazri':'111289','Zahidah':'131530','Zulkiple':'133513'};
  const CONF_NAMES = Object.keys(CONF_PASS).sort();
  const CATS = { opError:'Op.Error', stoppage:'Stoppage', damage:'Damage', noise:'Noise etc.', othersType1:'Others' };
  const CATS2 = { mech:'Mech.', elec:'Elec.', it:'I.T.', operation:'Operation', othersType2:'Others' };
  const URGENCY = { veryCritical:'Very Critical', within24hrs:'Within 24hrs', within2months:'Within 2 months', within1week:'Within 1 week' };
  const ACTION_CAT = { reset:'Reset', adjustment:'Adjustment', replace:'Replace', temporary:'Temporary', othersAction:'Others' };
  const RESULT_CAT = { testedOK:'Tested OK', modified:'Modified', pending:'Pending', temporary2:'Temporary', rectified:'Rectified', forceRun:'Force Run', kiv:'KIV' };
  const URGENCY_MS = { veryCritical: 4*3600000, within24hrs: 24*3600000, within1week: 7*86400000, within2months: 60*86400000 };
  const GROUP_OPTIONS = ['Shift A', 'Shift B', 'Shift C', 'Shift D', 'OH', 'Vendor'];
  const MAIN_CAT_OPTIONS = ['Conveyor Line', 'Vehicle', 'Equipment/Tool', 'Facility', 'Other'];

  function showModal(title, msg, type = 'alert', errorMode = false) {
    return new Promise(resolve => {
      let overlay = document.getElementById('acm-modal-overlay');
      if(!overlay){
        overlay = document.createElement('div');
        overlay.id = 'acm-modal-overlay';
        overlay.innerHTML = `<div id="acm-modal-box"><div id="acm-modal-title"></div><div id="acm-modal-msg"></div><input type="password" id="acm-modal-input" placeholder="Enter password..." autocomplete="new-password"/><div id="acm-modal-actions"></div></div>`;
      }
      if(overlay.parentNode !== ROOT) ROOT.appendChild(overlay);
      const titleEl = overlay.querySelector('#acm-modal-title'), msgEl = overlay.querySelector('#acm-modal-msg'), inputEl = overlay.querySelector('#acm-modal-input'), actionsEl = overlay.querySelector('#acm-modal-actions');
      titleEl.textContent = title; msgEl.textContent = msg; inputEl.style.display = type === 'prompt' ? 'block' : 'none'; inputEl.value = ''; actionsEl.innerHTML = '';
      function close() { overlay.classList.remove('active'); }
      const createBtn = (cls, text, cb) => { const b = document.createElement('button'); b.className = cls; b.textContent = text; b.onclick = () => { close(); cb(); }; return b; };
      if(type === 'alert') actionsEl.appendChild(createBtn(errorMode ? 'btn btn-danger' : 'btn btn-primary', 'OK', () => resolve(true)));
      else if(type === 'confirm'){ actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(false))); actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Delete', () => resolve(true))); }
      else if(type === 'prompt'){
        actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(null)));
        const handleSub = () => { close(); resolve(inputEl.value); };
        const ob = createBtn('btn btn-primary', 'Confirm', handleSub); actionsEl.appendChild(ob);
        inputEl.onkeydown = e => { if(e.key === 'Enter') handleSub(); };
      }
      else if(type === 'unsaved'){ actionsEl.appendChild(createBtn('btn btn-primary', 'Cancel & Keep Editing', () => resolve(false))); actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Discard Data', () => resolve(true))); }
      void overlay.offsetWidth; overlay.classList.add('active'); if(type === 'prompt') setTimeout(() => inputEl.focus(), 50);
    });
  }

  function blankRecord() {
    return { createdAt: Date.now(), isDraft: true, status: '', maintenanceType: '', reportNo: '', happeningDate: '', timeOfHappening:'', dd:'', mm:'', yy:'', issuedBy:'', issuedGroup:'', title:'', area:'', subArea:'', areaNo:'', conveyorItem:'', lineEquipment:'', equipNo:'', cat1: {}, cat2: {}, urgency:'', reasonDetail:'', monitoring: [ {d1:'',b1:'',r1:'',d2:'',b2:'',r2:''} ], spStock:'', spStockQty:'', spStockCritical:'', spCheckedBy:'', spQty:'', spLocation:'', spCheckBy:'', spRequestDate:'', spDeliveryDate:'', spLocation2:'', requestOfAction:'', actionDate: '', actDoneBy:'', actGroup:'', actStartTime:'', actEndTime:'', actDd:'', actMm:'', actYy:'', actionCat:'', actionDetail:'', history: [ {date:'',remark:''}, {date:'',remark:''}, {date:'',remark:''} ], resultCat:'', paramSpeed:'', paramTemp:'', paramCurrent:'', paramVoltage:'', resultDetail:'', parts: Array.from({length:9}, () => ({ item:'', spec:'', part:'', qty:'', dismantle:'', sap:'' })), flags: { createNotification:false, createWorkOrder:false, releaseWorkOrder:false, gmps:false, timeConfirmation:false, teco:false, businessCompletion:false }, doneByName:'', checkByName:'', confirmedByName:'' };
  }

  let state = { tab: 'dashboard', records: [], activeId: null, cleanActiveRecord: null, isDirty: false, loaded: false, showErrors: false };
  const checkReq = v => v != null && String(v).trim() !== '';

  async function loadRecords() {
    try { if (window.storage) { const res = await window.storage.get(STORE_KEY, false); if (res && res.value) state.records = JSON.parse(res.value); } } catch (e) { state.records = []; }
    window.syncGoogleSheets = function(googleData) {
      const cleanDate = iso => { if (!iso || typeof iso !== 'string' || !iso.includes('T')) return iso; const d = new Date(iso); if (isNaN(d)) return iso; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const cleanTime = iso => (!iso || typeof iso !== 'string' || !iso.includes('T')) ? iso : new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      let validData = [];
      googleData.forEach(g => {
        if (!g.createdAt || String(g.createdAt).trim() === '') return;
        g.happeningDate = cleanDate(g.happeningDate); g.actionDate = cleanDate(g.actionDate); g.spRequestDate = cleanDate(g.spRequestDate); g.spDeliveryDate = cleanDate(g.spDeliveryDate);
        g.timeOfHappening = cleanTime(g.timeOfHappening); g.actStartTime = cleanTime(g.actStartTime); g.actEndTime = cleanTime(g.actEndTime);
        if (g.monitoring) g.monitoring.forEach(m => { m.d1 = cleanDate(m.d1); m.d2 = cleanDate(m.d2); });
        if (g.history) g.history.forEach(h => h.date = cleanDate(h.date));
        validData.push(g);
      });
      const drafts = state.records.filter(r => r.isDraft);
      const cloudIds = new Set(validData.map(g => String(g.createdAt)));
      const localOffline = state.records.filter(r => !r.isDraft && !cloudIds.has(String(r.createdAt)));
      state.records = [...drafts, ...localOffline, ...validData].sort((a,b) => b.createdAt - a.createdAt);
      state.loaded = true;
      const validOrActive = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
      if (validOrActive.length > 0 && !state.activeId) state.activeId = validOrActive[0].createdAt;
      render();
    };
    const script = document.createElement('script');
    script.src = WEB_APP_URL + "?action=read&callback=syncGoogleSheets";
    document.body.appendChild(script);
    state.loaded = true; render();
  }

  async function saveRecords() { try { if(window.storage) await window.storage.set(STORE_KEY, JSON.stringify(state.records), false); } catch(e){} }
  function revertActiveRecord() { if(state.cleanActiveRecord && state.activeId) { const idx = state.records.findIndex(x => String(x.createdAt) === String(state.activeId)); if (idx !== -1) { state.records[idx] = JSON.parse(JSON.stringify(state.cleanActiveRecord)); saveRecords(); } } state.isDirty = false; }
  
  function getNextReportNo() {
    const prefix = `${String(new Date().getFullYear()).slice(-2)}${String(new Date().getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => { if (rec.reportNo && rec.reportNo.startsWith(prefix)) { const num = parseInt(rec.reportNo.split('-')[1], 10); if (!isNaN(num) && num > max) max = num; } });
    return prefix + String(max + 1).padStart(3, '0');
  }

  function fmtDate(r) { if (r.happeningDate) { const p = String(r.happeningDate).substring(0, 10).split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0].slice(-2)}`; } return (!r.dd && !r.mm && !r.yy) ? '—' : `${(r.dd||'--').padStart(2,'0')}/${(r.mm||'--').padStart(2,'0')}/${r.yy||'--'}`; }
  function getTs(iso) { if (iso && typeof iso === 'string') { const p = iso.split('-'); if (p.length === 3) return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])).getTime(); } return null; }
  function getOldTs(dd, mm, yy) { return (!dd || !mm || !yy) ? null : new Date(parseInt(yy.length === 2 ? ('20' + yy) : yy), parseInt(mm)-1, parseInt(dd)).getTime(); }
  function getExactTs(dateStr, oldDd, oldMm, oldYy, timeStr) {
    let t = getTs(dateStr) || getOldTs(oldDd, oldMm, oldYy);
    if (t && timeStr && typeof timeStr === 'string') { const parts = timeStr.split(':'); if (parts.length >= 2) t += ((parseInt(parts[0], 10) || 0) * 3600000) + ((parseInt(parts[1], 10) || 0) * 60000); }
    return t;
  }

  function getStatus(r) {
    const wordCount = str => (str || '').trim().split(/\s+/).filter(w => w.length > 0).length;
    let agBase = r.actGroup || '', actGroupValid = agBase.toUpperCase().startsWith('VENDOR') ? agBase.substring(6).replace(/^:\s*/, '').trim().length > 0 : agBase.trim() !== '';
    const hasActionDate = checkReq(r.actionDate) || (checkReq(r.actDd) && checkReq(r.actMm) && checkReq(r.actYy));
    const actionComplete = hasActionDate && checkReq(r.actDoneBy) && actGroupValid && checkReq(r.actStartTime) && checkReq(r.actEndTime) && checkReq(r.actionCat) && wordCount(r.actionDetail) >= 2;
    const resultComplete = checkReq(r.resultCat) && wordCount(r.resultDetail) >= 2;
    const f = r.flags || {};
    const checklistComplete = f.createNotification || f.createWorkOrder || f.releaseWorkOrder || f.gmps || f.timeConfirmation || f.teco || f.businessCompletion;
    const confirmValid = checkReq(r.confirmedByName);
    const signOffComplete = (r.doneByName || '').trim().length >= 3 && (r.checkByName || '').trim().length >= 3 && confirmValid;
    if (actionComplete && resultComplete && checklistComplete && signOffComplete) return 'done';

  }

  function getFilteredDashboardRecords() {
    const sDate = document.getElementById('dash-start')?.value, eDate = document.getElementById('dash-end')?.value;
    const getSel = n => Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(cb => cb.value);
    const selUrg = getSel('dash-urgency'), selCat = getSel('dash-cat'), selStat = getSel('dash-status');
    const lineQ = (document.getElementById('dash-line')?.value || '').toLowerCase(), convQ = (document.getElementById('dash-conveyor')?.value || '').toLowerCase();
    const startTs = sDate ? getTs(sDate) : 0, endTs = eDate ? (getTs(eDate) + 86400000) : Infinity;
    return state.records.filter(r => !r.isDraft).filter(r => {
      const t = getTs(r.happeningDate) || getOldTs(r.dd, r.mm, r.yy);
      if ((sDate || eDate) && (!t || t < startTs || t >= endTs)) return false;
      if (selUrg.length && !selUrg.includes(r.urgency)) return false;
      if (selStat.length && !selStat.includes(getStatus(r))) return false;
      if (selCat.length && !selCat.some(c => (r.cat1 && r.cat1[c]) || (r.cat2 && r.cat2[c]))) return false;
      if (lineQ && !((r.lineEquipment||'') + '-' + (r.equipNo||'')).toLowerCase().includes(lineQ)) return false;
      if (convQ && !(r.conveyorItem || '').toLowerCase().includes(convQ)) return false;
      return true;
    });
  }

  function computeKPIs(activeRecs) {
    activeRecs = activeRecs || state.records.filter(r => !r.isDraft);
    const open = activeRecs.filter(r => getStatus(r) !== 'done'), completed = activeRecs.filter(r => getStatus(r) === 'done');
    let resTimes = [], catCounts = {}, ratedTotal = 0, onTime = 0;
    Object.keys(CATS).forEach(k => catCounts[CATS[k]] = 0); Object.keys(CATS2).forEach(k => catCounts[CATS2[k]] = 0);
    activeRecs.forEach(r => {
      if(r.cat1) Object.keys(CATS).forEach(k => { if(r.cat1[k]) catCounts[CATS[k]]++; });
      if(r.cat2) Object.keys(CATS2).forEach(k => { if(r.cat2[k]) catCounts[CATS2[k]]++; });
    });
    completed.forEach(r => {
      const t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy, r.timeOfHappening);
      const t1 = getExactTs(r.actionDate, r.actDd, r.actMm, r.actYy, r.actEndTime);
      if(t0 && t1 && t1 >= t0) resTimes.push((t1 - t0) / 86400000); 
      if(t0 && t1 && URGENCY_MS[r.urgency]) { ratedTotal++; if((t1 - t0) <= URGENCY_MS[r.urgency]) onTime++; }
    });
    let topCat = null, topCatCount = 0;
    Object.entries(catCounts).forEach(([k,v]) => { if(v > topCatCount) { topCat = k; topCatCount = v; } });
    return { total: activeRecs.length, openCount: open.length, completedCount: completed.length, avgRes: resTimes.length ? (resTimes.reduce((a,b)=>a+b,0)/resTimes.length) : null, criticalPending: open.filter(r => r.urgency === 'veryCritical' || r.urgency === 'within24hrs').length, topCat, topCatCount, onTimeRate: ratedTotal ? Math.round((onTime/ratedTotal)*100) : null, catCounts };
  }

  function applyTimelineFilters(chartInstance, containerId) {

      const vD = chartInstance.isDatasetVisible(0);
      const vP = chartInstance.isDatasetVisible(1);
      const vO = chartInstance.isDatasetVisible(2);
      
      const mD = chartInstance.data._masterDone || [];
      const mP = chartInstance.data._masterProg || [];
      const mO = chartInstance.data._masterOpen || [];
      const mL = chartInstance.data._masterLabels || [];
      
      const vL = mL.filter(lbl => 
          (vD && mD.some(d => d.y === lbl)) || 
          (vP && mP.some(d => d.y === lbl)) || 
          (vO && mO.some(d => d.y === lbl))
      );
      
      chartInstance.data.labels = vL;
      chartInstance.data.datasets[0].data = vD ? mD.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[1].data = vP ? mP.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[2].data = vO ? mO.filter(d => vL.includes(d.y)) : [];
      
      const cContainer = document.getElementById(containerId);
      if(cContainer) {
          const availableHeight = cContainer.clientHeight;
          const maxVisible = Math.max(1, Math.floor((availableHeight - 40) / 35));

  function createTimelineChart(ctx) {
      return new Chart(ctx, {
          type: 'bar',
          plugins: [{ 
            id:'customCanvasBackgroundColor', 
            beforeDraw:(chart, args, options)=>{ 
                const ctx = chart.ctx; 
                ctx.save(); 
                ctx.fillStyle = options.color || '#ffffff'; 
                ctx.fillRect(0,0,chart.width,chart.height); 
                ctx.restore(); 
            } 
          }, {
            id: 'slaOutline',
            beforeDatasetsDraw(chart) {
              const ctx = chart.ctx, xAxis = chart.scales.x;
              const URG_COLORS = { veryCritical: '#dc2626', within24hrs: '#d97706', within1week: '#eab308', within2months: '#2563eb' };
              const drawn = new Set();
              ctx.save();
              ctx.beginPath();
              ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
              ctx.clip();

              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((bar, index) => {
                  const raw = dataset.data[index];
                  if (!raw || !raw._r) return;
                  const memoId = raw._r.createdAt;
                  if (drawn.has(memoId)) return;
                  drawn.add(memoId);
                  const r = raw._r, t0 = raw._totalX[0], durMs = URGENCY_MS[r.urgency] || 0;
                  if (durMs > 0) {
                    const targetT = t0 + durMs, startX = xAxis.getPixelForValue(t0), endX = xAxis.getPixelForValue(targetT);
                    const w = endX - startX, h = bar.height + 8, y = bar.y - h/2;
                    ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = URG_COLORS[r.urgency] || '#9ca3af'; 
                    if(ctx.roundRect) { ctx.roundRect(startX, y, w, h, 6); } else { ctx.rect(startX, y, w, h); }
                    ctx.stroke();
                  }
                });
              });
              ctx.restore();
            }
          }, {
            id: 'timelineShapes',
            afterDatasetsDraw(chart) {
              const ctx = chart.ctx;
              ctx.save();
              ctx.beginPath();
              ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
              ctx.clip();

              chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((bar, index) => {
                  const raw = dataset.data[index];
                  if (!raw || !raw._isOpenLine) return;
                  const yCenter = bar.y, h = bar.height;
                  const startX = chart.scales.x.getPixelForValue(raw._t0);
                  const endX = chart.scales.x.getPixelForValue(raw._t1);
                  ctx.beginPath(); ctx.moveTo(startX, yCenter); ctx.lineTo(endX, yCenter);
                  ctx.lineWidth = 2; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
                  ctx.beginPath(); ctx.arc(startX, yCenter, Math.min(h / 3, 5), 0, 2 * Math.PI);
                  ctx.fillStyle = '#9ca3af'; ctx.fill();
                });
              });
              ctx.restore();
            }
          }],
          data: { 
              labels:[], 
              datasets:[
                  {label:'Completed', data:[], backgroundColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 0.45)', borderColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 1)', borderWidth:1, borderRadius:6, borderSkipped:false, barPercentage:0.45},

              chartInstance.update('none');
          });

          canvas.addEventListener('pointerup', e => {
              canvas.releasePointerCapture(e.pointerId);
              canvas.style.cursor = 'grab';
              canvas.dataset.isDragging = "false";
          });

          canvas.addEventListener('wheel', e => {
              e.preventDefault();
              const chartInstance = Chart.getChart(canvas);
              if (!chartInstance) return;

              const zoomIntensity = 0.1;
              const zoomDir = e.deltaY < 0 ? 1 : -1;
              const xAxis = chartInstance.scales.x;
              const yAxis = chartInstance.scales.y;
              const rect = canvas.getBoundingClientRect();
              const mouseX = e.clientX - rect.left;
              const mouseY = e.clientY - rect.top;

              let curXMin = chartInstance.options.scales.x.min ?? xAxis.min;
              let curXMax = chartInstance.options.scales.x.max ?? xAxis.max;
              const xRange = curXMax - curXMin;
              const xRatio = Math.max(0, Math.min(1, (mouseX - xAxis.left) / xAxis.width));
              const xDelta = xRange * zoomIntensity * zoomDir;
              
              chartInstance.options.scales.x.min = curXMin + xDelta * xRatio;
              chartInstance.options.scales.x.max = curXMax - xDelta * (1 - xRatio);

              const labelsLen = chartInstance.data.labels.length;
              if (labelsLen > 0) {
                  let curYMin = chartInstance.options.scales.y.min ?? 0;
                  let curYMax = chartInstance.options.scales.y.max ?? (labelsLen - 1);
                  const yRange = curYMax - curYMin;
                  
                  if (zoomDir === -1 && curYMin <= 0 && curYMax >= labelsLen - 1) {
                  } else {
                      const yRatio = Math.max(0, Math.min(1, (mouseY - yAxis.top) / yAxis.height));
                      const yDelta = Math.max(1, yRange * zoomIntensity) * zoomDir;

                      let newYMin = curYMin + yDelta * yRatio;
                      let newYMax = curYMax - yDelta * (1 - yRatio);

                      if (zoomDir === -1) {
                          if (newYMin < 0) { newYMax -= newYMin; newYMin = 0; }
                          if (newYMax >= labelsLen) { newYMin -= (newYMax - (labelsLen - 1)); newYMax = labelsLen - 1; if (newYMin < 0) newYMin = 0; }
                      }

                      if (newYMax - newYMin >= 1) { 
                          chartInstance.options.scales.y.min = Math.max(0, Math.floor(newYMin));
                          chartInstance.options.scales.y.max = Math.min(labelsLen - 1, Math.ceil(newYMax));
                      }
                  }
              }
              chartInstance.update('none');
          }, { passive: false });

          canvas.addEventListener('dblclick', () => {
              if (canvasId === 'acm-timeline-chart') updateDashboardUI();
              else document.getElementById('full-view-btn').click();
          });
          
          canvas.style.cursor = 'grab';
      };

      const customBgPlugin = { id:'customCanvasBackgroundColor', beforeDraw:(c, a, o)=>{ const ctx=c.ctx; ctx.save(); ctx.globalCompositeOperation='destination-over'; ctx.fillStyle=o.color||'#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.restore(); } };

      const verticalLinePlugin = {
        id: 'verticalLine',
        afterDraw: chart => {
          const xIndex = chart.config.options.plugins?.verticalLine?.index;
          if (xIndex === undefined || xIndex <= 0 || xIndex >= chart.data.labels.length) return;
          const ctx = chart.ctx;
          const xAxis = chart.scales.x;
          const yAxis = chart.scales.y;
          const leftTick = xAxis.getPixelForTick(xIndex - 1);
          const rightTick = xAxis.getPixelForTick(xIndex);
          if (leftTick === undefined || rightTick === undefined) return;
          const xPos = (leftTick + rightTick) / 2;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(xPos, yAxis.top);
          ctx.lineTo(xPos, yAxis.bottom);
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = '#9ca3af';
          ctx.stroke();
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#6b7280';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText('CATEGORY', (xAxis.left + xPos) / 2, yAxis.top + 5);
          ctx.fillText('TYPE', (xPos + xAxis.right) / 2, yAxis.top + 5);
          ctx.restore();
        }
      };

      const tlCtx = document.getElementById('acm-timeline-chart'); 
      if(tlCtx) {
          if (timelineChart) timelineChart.destroy();
          timelineChart = createTimelineChart(tlCtx);
      }
      
      const catCtx = document.getElementById('acm-category-chart');
      if (catCtx) {
        if(categoryChart) categoryChart.destroy();
        categoryChart = new Chart(catCtx, { 
          type: 'bar', 
          plugins:[customBgPlugin, verticalLinePlugin], 
          data: { labels:[], datasets:[{label:'Occurrences', data:[], backgroundColor:[], borderColor:[], borderWidth:1, borderRadius:4}] }, 
          options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{backgroundColor:'rgba(17, 24, 39, 0.95)', titleFont:{size:13, weight:'bold'}, bodyFont:{size:12}, padding:10, cornerRadius:8}}, scales:{y:{beginAtZero:true, title:{display:true, text:'Total Memo', font:{size:12, weight:'bold'}}, ticks:{stepSize:1, font:{size:10}}}, x:{ticks:{font:{size:10}, maxRotation:0, minRotation:0, display:true}}} } 
        });
      }

      const centerTextPlugin = {
        id:'centerText',
        beforeDraw: c => {
          if(c.config.type!=='doughnut') return;
          const w = c.width, h = c.height, ctx = c.ctx;
          ctx.restore();
          
          const meta = c.getDatasetMeta(0);
          const centerX = meta.data.length ? meta.data[0].x : w/2;
          const centerY = meta.data.length ? meta.data[0].y : h/2;

          ctx.font = "bold " + (h/114).toFixed(2) + "em sans-serif";
          ctx.textBaseline = "middle";
          ctx.textAlign = "center";
          ctx.fillStyle = "#1f2937";
          
          const tot = c.data.datasets[0].data.reduce((a,b)=>a+b,0);
          ctx.fillText(tot.toString(), centerX, centerY - 6);
          
          ctx.font = "normal " + ((h/114).toFixed(2)*0.35) + "em sans-serif";
          ctx.fillText("Total Memo", centerX, centerY + 12);
          ctx.save();
        }
      };

      const sliceLabelsPlugin = { 
        id:'sliceLabels', 
        afterDatasetsDraw: c => { 
          if(c.config.type!=='doughnut') return; 
          const ctx=c.ctx, ds=c.data.datasets[0], tot=ds.data.reduce((a,b)=>a+b,0); 
          if(!tot) return; 
          c.getDatasetMeta(0).data.forEach((sec,i) => { 
            if(!ds.data[i]) return; 
            const pos=sec.tooltipPosition(); 
            ctx.fillStyle='#374151'; 
            ctx.font='bold 13px sans-serif'; 
            ctx.textAlign='center'; 
            ctx.textBaseline='middle'; 
            ctx.shadowColor='rgba(255,255,255,0.85)'; 
            ctx.shadowBlur=4; 
            ctx.fillText(Math.round((ds.data[i]/tot)*100)+'%', pos.x, pos.y); 
            ctx.shadowBlur=0; 
          }); 
        } 
      };

      const urgCtx = document.getElementById('acm-urgency-chart');
      if (urgCtx) {
        if(urgencyChart) urgencyChart.destroy();
        urgencyChart = new Chart(urgCtx, { type: 'doughnut', plugins: [customBgPlugin, centerTextPlugin, sliceLabelsPlugin], data: { labels:['Very Critical', 'Within 24hrs', 'Within 1 week', 'Within 2 months'], datasets:[{data:[0,0,0,0], backgroundColor:['rgba(220, 38, 38, 0.45)', 'rgba(217, 119, 6, 0.45)', 'rgba(234, 179, 8, 0.45)', 'rgba(37, 99, 235, 0.45)'], borderColor:['rgba(220, 38, 38, 1)', 'rgba(217, 119, 6, 1)', 'rgba(234, 179, 8, 1)', 'rgba(37, 99, 235, 1)'], borderWidth:1, hoverOffset:4}] }, options: { responsive:true, maintainAspectRatio:false, cutout:'45%', plugins:{ legend:{position:'right', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, font:{size:11}}}, tooltip:{ backgroundColor:'rgba(17, 24, 39, 0.95)', titleFont:{size:13, weight:'bold'}, bodyFont:{size:12}, padding:10, cornerRadius:8, callbacks:{ label: c => ` ${c.label||''}: ${c.raw||0} memo${c.raw!==1?'s':''} (${Math.round(((c.raw||0)/(c.chart._metasets[c.datasetIndex].total||1))*100)}%)` } } } } });
      }

      updateDashboardUI();
    });
  }

  function checkbox(lbl, chk, path) { return `<label class="chk"><input type="checkbox" data-path="${path}" ${chk?'checked':''}/> ${lbl}</label>`; }
  function radio(nm, lbl, val, chk, path) { return `<label class="rad"><input type="radio" name="${nm}" data-path="${path}" value="${val}" ${chk?'checked':''}/> ${lbl}</label>`; }
  function field(lbl, path, val, typ='text', ext='') { return `<label class="f">${lbl}${typ==='textarea'?`<textarea data-path="${path}" ${ext}>${val||''}</textarea>`:`<input type="${typ}" data-path="${path}" value="${val||''}" ${ext}/>`}</label>`; }
  function selectField(lbl, path, val, opts) { return `<label class="f">${lbl}<select data-path="${path}"><option value=""></option>${opts.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`; }
  function groupField(lbl, tKey, bVal, vVal, isMainCat = false) { 
    const opts = isMainCat ? MAIN_CAT_OPTIONS : GROUP_OPTIONS;
    const specLabel = isMainCat ? 'Specify...' : 'Vendor Name...';
    const triggerVal = isMainCat ? 'Other' : 'Vendor';
    return `<label class="f">${lbl}<div style="display:flex;gap:6px"><select style="flex:1;min-width:0" data-calc-group="${tKey}" data-part="base"><option value=""></option>${opts.map(o=>`<option value="${o}" ${bVal===o?'selected':''}>${o}</option>`).join('')}</select>${bVal===triggerVal?`<input type="text" style="flex:1;min-width:0" placeholder="${specLabel}" data-calc-group="${tKey}" data-part="vendor" value="${vVal}"/>`:''}</div></label>`; 
  }
  function searchableSelectField(lbl, path, val, opts, lid) { return `<label class="f">${lbl}<input type="text" data-path="${path}" value="${val||''}" list="${lid}" autocomplete="off" placeholder="Type or select..."/><datalist id="${lid}">${opts.map(o=>`<option value="${o}"></option>`).join('')}</datalist></label>`; }
  function ensureRows(arr, len, tplFn) { arr = arr||[]; while(arr.length < len) arr.push(tplFn()); return arr; }

  function updateHighlights(container, r) {
    if (!state.showErrors) return;
    container.querySelectorAll('.err-highlight, .err-sec').forEach(el => el.classList.remove('err-highlight', 'err-sec'));
    
    let igBase = r.issuedGroup || ''; 
    if(igBase.toUpperCase().startsWith('OTHER:')) igBase = 'Other';
    
    ['happeningDate', 'issuedBy', 'reportNo', 'maintenanceType', 'timeOfHappening', 'title', 'area', 'subArea', 'areaNo', 'lineEquipment'].forEach(k => { if(!checkReq(r[k])) container.querySelector(`[data-path="${k}"]`)?.classList.add('err-highlight'); });
    
    let needsEquipNo = igBase !== 'Other';
    let needsConvItem = ['Conveyor Line', 'Equipment/Tool'].includes(igBase || 'Conveyor Line');
    
    if (needsEquipNo && !checkReq(r.equipNo)) container.querySelector(`[data-path="equipNo"]`)?.classList.add('err-highlight');
    if (needsConvItem && !checkReq(r.conveyorItem)) container.querySelector(`[data-path="conveyorItem"]`)?.classList.add('err-highlight');

    if((r.reasonDetail||'').trim().split(/\s+/).filter(w=>w.length>0).length < 2) container.querySelector('[data-path="reasonDetail"]')?.classList.add('err-highlight');
    if(!igBase || (igBase.toUpperCase() === 'OTHER' && (r.issuedGroup||'').trim().toUpperCase() === 'OTHER')) container.querySelectorAll('[data-calc-group="issuedGroup"]').forEach(el=>el.classList.add('err-highlight'));
    if(!(r.cat1 && Object.keys(CATS).some(k=>r.cat1[k])) || !(r.cat2 && Object.keys(CATS2).some(k=>r.cat2[k]))) container.querySelector('#sec-category')?.classList.add('err-sec');
    if(!r.urgency) container.querySelector('#sec-urgency')?.classList.add('err-sec');
  }

ield('Describe the reason and detail of the fault','reasonDetail',r.reasonDetail,'textarea')}</div><div class="sec"><div class="sec-title">Monitoring Status (Progress)</div><table class="editrows"><thead><tr><th>Insp. Date</th><th>By</th><th>Result</th><th>Insp. Date</th><th>By</th><th>Result</th></tr></thead><tbody>${(r.monitoring||[]).map((m,i)=>`<tr><td><input type="date" data-path="monitoring.${i}.d1" value="${m.d1||''}"/></td><td><input type="text" data-path="monitoring.${i}.b1" value="${m.b1||''}"/></td><td><input type="text" data-path="monitoring.${i}.r1" value="${m.r1||''}"/></td><td><input type="date" data-path="monitoring.${i}.d2" value="${m.d2||''}"/></td><td><input type="text" data-path="monitoring.${i}.b2" value="${m.b2||''}"/></td><td><input type="text" data-path="monitoring.${i}.r2" value="${m.r2||''}"/></td></tr>`).join('')}</tbody></table></div><div class="sec"><div class="sec-title">Spare Part Status</div><div class="hint" style="font-size:.65rem;color:var(--text-sec);margin-bottom:6px">Row 1</div><div class="grid g5">${field('Stock:','spStock',r.spStock)}${field('Stock Qty','spStockQty',r.spStockQty)}${field('Stock: Critical','spStockCritical',r.spStockCritical)}${field('Checked by','spCheckedBy',r.spCheckedBy)}${field('Qty','spQty',r.spQty)}</div><div class="hint" style="font-size:.65rem;color:var(--text-sec);margin:10px 0 6px">Row 2</div><div class="grid g5">${field('Location','spLocation',r.spLocation)}${field('Check by','spCheckBy',r.spCheckBy)}${field('Request date','spRequestDate',r.spRequestDate,'date')}${field('Delivery date','spDeliveryDate',r.spDeliveryDate,'date')}${field('Location (2)','spLocation2',r.spLocation2)}</div></div><div class="sec"><div class="sec-title">Request of Action</div>${field('Request of action','requestOfAction',r.requestOfAction,'textarea')}</div><div class="sec"><div class="sec-title">Action</div><div class="grid g3">${field('Date','actionDate',r.actionDate,'date')}${field('Done By','actDoneBy',r.actDoneBy)}${groupField('Group','actGroup',agBase,agVendor,false)}</div><div class="grid g2" style="margin-top:10px">${field('Start time','actStartTime',r.actStartTime,'time')}${field('End time','actEndTime',r.actEndTime,'time')}</div><div style="margin-top:10px"><div class="sec-title" style="font-size:.65rem">Category</div><div class="radio-row">${Object.entries(ACTION_CAT).map(([k,l])=>radio('actionCat',l,k,r.actionCat===k,'actionCat')).join('')}</div></div><div style="margin-top:10px">${field('Detail','actionDetail',r.actionDetail,'textarea')}</div></div><div class="sec"><div class="sec-title">History (Last 3 Changing Dates)</div><table class="editrows"><thead><tr><th>#</th><th>Date</th><th>Remark</th></tr></thead><tbody>${(r.history||[]).map((h,i)=>`<tr><td style="width:30px">${i+1})</td><td><input type="date" data-path="history.${i}.date" value="${h.date||''}"/></td><td><input type="text" data-path="history.${i}.remark" value="${h.remark||''}"/></td></tr>`).join('')}</tbody></table></div><div class="sec"><div class="sec-title">Result</div><div class="radio-row">${Object.entries(RESULT_CAT).map(([k,l])=>radio('resultCat',l,k,r.resultCat===k,'resultCat')).join('')}</div><div class="grid g4" style="margin-top:10px">${field('Speed (m/min)','paramSpeed',r.paramSpeed)}${field('Temp (°C)','paramTemp',r.paramTemp)}${field('Current (A)','paramCurrent',r.paramCurrent)}${field('Voltage (V)','paramVoltage',r.paramVoltage)}</div><div style="margin-top:10px">${field('Detail / Status','resultDetail',r.resultDetail,'textarea')}</div></div><div class="sec"><div class="sec-title">Parts Record</div><table class="editrows"><thead><tr><th>No.</th><th>Item/Equipment name</th><th>Specification</th><th>Part</th><th>Qty</th><th>Dismantle part status</th><th>SAP No / Others</th></tr></thead><tbody>${(r.parts||[]).map((p,i)=>`<tr><td style="width:30px">${i+1}</td><td><input type="text" data-path="parts.${i}.item" value="${p.item||''}"/></td><td><input type="text" data-path="parts.${i}.spec" value="${p.spec||''}"/></td><td><input type="text" data-path="parts.${i}.part" value="${p.part||''}"/></td><td><input type="text" data-path="parts.${i}.qty" value="${p.qty||''}"/></td><td><input type="text" data-path="parts.${i}.dismantle" value="${p.dismantle||''}"/></td><td><input type="text" data-path="parts.${i}.sap" value="${p.sap||''}"/></td></tr>`).join('')}</tbody></table></div><div class="sec"><div class="sec-title">Completion Checklist</div><div class="check-row">${checkbox('Create Notification',(r.flags||{}).createNotification,'flags.createNotification')}${checkbox('Create Work Order',(r.flags||{}).createWorkOrder,'flags.createWorkOrder')}${checkbox('Release Work Order',(r.flags||{}).releaseWorkOrder,'flags.releaseWorkOrder')}${checkbox('GMPS',(r.flags||{}).gmps,'flags.gmps')}</div><div class="check-row" style="margin-top:8px">${checkbox('Time Confirmation',(r.flags||{}).timeConfirmation,'flags.timeConfirmation')}${checkbox('TECO',(r.flags||{}).teco,'flags.teco')}${checkbox('Business Completion',(r.flags||{}).businessCompletion,'flags.businessCompletion')}</div></div><div class="sec"><div class="sec-title">Sign-off</div><div class="grid g3">${field('Done By (TECH)','doneByName',r.doneByName)}${field('Check By (TO/SP)','checkByName',r.checkByName)}${selectField('Confirmed By (TE/E/SE)','confirmedByName',r.confirmedByName,CONF_NAMES)}</div></div></div>`;

    updateHighlights(container, r);
    const wrapAction = async (cb) => { if(state.isDirty){ const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved"); if(!discard) return false; revertActiveRecord(); } return true; };

    container.querySelector('#acm-recpick').addEventListener('change', async (e) => { if(await wrapAction()){ state.showErrors = false; state.activeId = String(e.target.value); state.isDirty = false; render(); } else e.target.value = state.activeId; });
    container.querySelector('#acm-new-btn').addEventListener('click', async () => { if(await wrapAction()){ await showModal("Notice", "Please enter accurate INPUT for records", "alert"); const nr = blankRecord(); nr.reportNo = getNextReportNo(); state.records.unshift(nr); state.activeId = nr.createdAt; state.showErrors = false; state.isDirty = false; saveRecords(); render(); } });
    container.querySelector('#acm-del-btn').addEventListener('click', async () => {
      if(!await showModal("Confirm Deletion", "Delete this record? This cannot be undone.", "confirm")) return;
      const pass = await showModal("Authorization", "Password required to delete this record:", "prompt");
      if(pass === 'KLIA123!') {
        fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({payload: JSON.stringify({action:'delete', createdAt:r.createdAt})}) }).catch(console.error);
        state.records = state.records.filter(x => String(x.createdAt) !== String(r.createdAt)); state.activeId = state.records.length ? state.records[0].createdAt : null; state.showErrors = false; state.isDirty = false; saveRecords(); render(); await showModal("Deleted", "Record removed successfully.", "alert");
      } else if(pass !== null) await showModal("Error", "Incorrect password. Deletion cancelled.", "alert", true);
    });
    
    container.querySelector('#acm-submit-btn').addEventListener('click', async () => {
      state.showErrors = true; let errs = [];
      if(!checkReq(r.happeningDate)) errs.push("[Classification] Date");
      if(!checkReq(r.issuedBy)) errs.push("[Classification] Issued By");
      if(!igBase || (igBase.toUpperCase() === 'OTHER' && (r.issuedGroup||'').trim().toUpperCase()==='OTHER')) errs.push("[Classification] Category (Include Specify if Other)");
      if(!checkReq(r.reportNo)) errs.push("[Classification] Record No. (BHS/Record)");
      if(!checkReq(r.maintenanceType)) errs.push("[Classification] Classification");
      if(!checkReq(r.timeOfHappening)) errs.push("[Classification] Time");
      
      let needsEquipNo = igBase !== 'Other';
      let needsConvItem = ['Conveyor Line', 'Equipment/Tool'].includes(igBase || 'Conveyor Line');
      if(!checkReq(r.title) || !checkReq(r.area) || !checkReq(r.subArea) || !checkReq(r.areaNo) || !checkReq(r.lineEquipment) || (needsEquipNo && !checkReq(r.equipNo)) || (needsConvItem && !checkReq(r.conveyorItem))) {
         errs.push("[Title & Category] All required fields must be filled");
      }

      if(!(r.cat1 && Object.keys(CATS).some(k=>r.cat1[k])) || !(r.cat2 && Object.keys(CATS2).some(k=>r.cat2[k]))) errs.push("[Category & Type of Error] Select at least one category and one type");
      if(!r.urgency) errs.push("[Degree of Urgency] Please select one");
      if((r.reasonDetail||'').trim().split(/\s+/).filter(w=>w.length>0).length < 2) errs.push("[Reason / Detail] Please write at least 2 words");
      updateHighlights(container, r);

      if(errs.length) await showModal("Submit Failed", "Please complete the highlighted required data:\n\n- " + errs.join("\n- "), "alert", true);
      else {
        const statusLogic = getStatus(r); r.status = statusLogic==='done'?'Completed':statusLogic==='progress'?'In progress':'Open'; r.isDraft = false; state.showErrors = false; state.isDirty = false; state.cleanActiveRecord = JSON.parse(JSON.stringify(r)); saveRecords();
        const btn = container.querySelector('#acm-submit-btn'), ogTxt = btn.innerHTML; btn.innerHTML = 'Saving to Sheet ⏳'; btn.style.pointerEvents = 'none';
        try { await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({payload: JSON.stringify(r)}) }); setTimeout(async () => { await showModal("Success", "Record saved to Google Sheets!", "alert"); render(); }, 1200); } 
        catch (e) { console.error(e); await showModal("Error", "An unexpected error occurred. Saved locally.", "alert", true); btn.innerHTML = ogTxt; btn.style.pointerEvents = 'auto'; }
      }
    });

    container.querySelectorAll('[data-calc-group]').forEach(el => el.addEventListener(el.tagName==='SELECT'?'change':'input', () => {
      state.isDirty = true; 
      const wrp = el.closest('div'), bVal = wrp.querySelector('[data-part="base"]')?.value||'', vVal = wrp.querySelector('[data-part="vendor"]')?.value||'';
      const cg = el.getAttribute('data-calc-group');
      const isMainCat = cg === 'issuedGroup';
      const triggerVal = isMainCat ? 'Other' : 'Vendor';
      const newVal = (bVal === triggerVal) ? (vVal ? `${bVal}: ${vVal}` : bVal) : bVal;
      
      if (isMainCat) {
          let oldBase = r.issuedGroup || '';
          let parsedOld = oldBase.toUpperCase().startsWith('OTHER:') ? 'Other' : oldBase;
          if (bVal !== parsedOld) {
              r.lineEquipment = '';
              r.equipNo = '';
              r.conveyorItem = '';
          }
      }

      setByPath(r, cg, newVal); 
      saveRecords();
      if(el.getAttribute('data-part')==='base') render(); else updateHighlights(container, r);
    }));

    container.querySelectorAll('[data-path]').forEach(el => el.addEventListener((el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT')?'change':'input', async () => {
      const path = el.getAttribute('data-path'); let newVal = el.type==='checkbox'?el.checked:el.value;
      if(path === 'confirmedByName' && newVal !== '') {
        const pwd = await showModal("Authorization", `Enter 6-digit pin for ${newVal}:`, "prompt");
        if(pwd !== CONF_PASS[newVal]) { await showModal("Error", "Incorrect pin. Signature reversed.", "alert", true); el.value = r.confirmedByName || ''; return; }
      }
      state.isDirty = true; setByPath(r, path, newVal);
      if(path === 'lineEquipment') { r.equipNo = ''; container.querySelector('[data-path="equipNo"]').value=''; r.conveyorItem = ''; container.querySelector('[data-path="conveyorItem"]').value=''; const nL = container.querySelector('#no-list'); if(nL) { const opts = (r.lineEquipment && EQUIP_DB[r.lineEquipment])?Object.keys(EQUIP_DB[r.lineEquipment]).sort():[]; if(r.lineEquipment) opts.push('OTHERS'); nL.innerHTML = opts.map(o=>`<option value="${o}"></option>`).join(''); } }
      
      if((path === 'lineEquipment' || path === 'equipNo') && (!igBase || igBase === 'Conveyor Line')) { 
          r.conveyorItem = (r.lineEquipment && r.equipNo) ? (r.equipNo==='OTHERS'?'OTHERS':((EQUIP_DB[r.lineEquipment] && EQUIP_DB[r.lineEquipment][r.equipNo]) || '')) : ''; 
          const cEl = container.querySelector('[data-path="conveyorItem"]');
          if(cEl) cEl.value = r.conveyorItem; 
      }
      saveRecords(); updateHighlights(container, r);
    }));
  }

  function setByPath(obj, path, value) { const parts = path.split('.'); let cur = obj; for (let i = 0; i < parts.length - 1; i++) { cur = cur[isFinite(parts[i]) ? Number(parts[i]) : parts[i]]; } cur[parts[parts.length - 1]] = value; }

  function render() {
    ROOT.innerHTML = `<div class="wrap"><div class="topbar"><div class="brand"><div class="k">KLIA - Baggage Handling System T1</div><div class="t">BHS Maintenance : Resource Management Monitoring</div></div><div class="tabs"><button class="tab-btn ${state.tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button><button class="tab-btn ${state.tab==='input'?'active':''}" data-tab="input">Record Input</button></div></div><div id="acm-content"></div></div>`;
    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => { 
        const targetTab = b.getAttribute('data-tab');
        if (state.tab === 'input' && targetTab !== 'input' && state.isDirty) { const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved"); if (!discard) return; revertActiveRecord(); }
        state.tab = targetTab; render(); 
      });
    });
    const content = document.getElementById('acm-content');
    if (!state.loaded) { content.innerHTML = `<div class="empty-state">Loading records…</div>`; return; }
    if (state.tab === 'dashboard') renderDashboard(content);
    else if (state.tab === 'input') renderInput(content);
  }

  render();
  loadRecords();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
