<title>BHS Maintenance : Resource Management Monitoring</title>
<style>
  #acm-root,#acm-root *{box-sizing:border-box}
  #acm-root{--ink:#1f2937;--ink-light:#374151;--paper:#ffffff;--line:#e5e7eb;--line-dark:#9ca3af;--accent:#2563eb;--accent-2:#1d4ed8;--bg:#f3f4f6;--input-bg:#f9fafb;--text-sec:#6b7280;--ok:#059669;--warn:#d97706;--crit:#dc2626;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0;min-height:100%;font-size:.875rem;line-height:1.4;position:relative}
  .mono-font,#acm-root input[type=date],#acm-root input[type=time],#acm-root .kpi-value{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  #acm-root .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
  #acm-root .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  #acm-root .brand{display:flex;flex-direction:column;gap:2px}
  #acm-root .brand .k{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-sec);font-weight:700}
  #acm-root .brand .t{font-size:1.125rem;font-weight:800;color:var(--ink)}
  #acm-root .tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:10px;flex-wrap:wrap}
  #acm-root .tab-btn{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:600;color:var(--text-sec);cursor:pointer;transition:all .15s}
  #acm-root .tab-btn.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  #acm-root .tab-btn:hover:not(.active){color:var(--ink)}
  #acm-root .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .kpi-grid{grid-template-columns:repeat(2,1fr)}}
  #acm-root .kpi-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:visible}
  #acm-root .kpi-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
  #acm-root .kpi-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-sec);font-weight:700}
  #acm-root .kpi-value{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1;margin-top:2px}
  #acm-root .kpi-sub{font-size:.75rem;color:var(--text-sec)}
  #acm-root .kpi-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:999px;width:fit-content;margin-top:2px}
  #acm-root .pill-ok{background:#d1fae5;color:var(--ok)}
  #acm-root .pill-warn{background:#fef3c7;color:var(--warn)}
  #acm-root .pill-crit{background:#fee2e2;color:var(--crit)}
  #acm-root .dd-wrapper{position:relative;width:100%;margin-top:4px}
  #acm-root .dd-btn{width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);font-size:.75rem;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #acm-root .dd-btn::after{content:"▼";font-size:.55rem;margin-left:6px;color:var(--line-dark)}
  #acm-root .dd-menu{display:none;position:absolute;top:100%;left:0;width:100%;max-height:200px;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:7px;z-index:100;padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);margin-top:4px}
  #acm-root .dd-menu.open{display:flex;flex-direction:column;gap:6px}
  #acm-root [data-tooltip]{position:relative;cursor:help}
  #acm-root [data-tooltip]:hover::after{content:attr(data-tooltip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:6px 10px;border-radius:6px;font-size:.75rem;white-space:nowrap;z-index:100;margin-bottom:8px;pointer-events:none;font-weight:500;text-transform:none;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  #acm-root [data-tooltip]:hover::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#111827;margin-bottom:-2px;pointer-events:none;z-index:100}
  #acm-root .charts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media (max-width:980px){#acm-root .charts-grid{grid-template-columns:minmax(0,1fr)}}
  #acm-root .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;overflow:hidden}
  #acm-root .panel h3{margin:0 0 10px;font-size:.875rem;font-weight:800;color:var(--ink)}
  #acm-root .panel .hint{font-size:.75rem;color:var(--line-dark);margin-bottom:8px}
  #acm-root .table-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #acm-root table.list{width:100%;border-collapse:collapse}
  #acm-root table.list th,#acm-root table.editrows th{text-align:left;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-sec);background-color:var(--input-bg);padding:6px 8px;border-bottom:2px solid var(--line)}
  #acm-root table.list td,#acm-root table.editrows td{font-size:.7rem;color:var(--ink-light);padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  #acm-root table.list tr:hover td{background:var(--input-bg)}
  #acm-root .status-chip{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block}
  #acm-root .chip-open{background:#e5e7eb;color:var(--text-sec)}
  #acm-root .chip-progress{background:#fef3c7;color:var(--warn)}
  #acm-root .chip-done{background:#d1fae5;color:var(--ok)}
  #acm-root .chip-crit{background:#fee2e2;color:var(--crit)}
  #acm-root .link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:.75rem;cursor:pointer;padding:2px 4px}
  #acm-root .empty-state{text-align:center;padding:34px 10px;color:var(--text-sec);font-size:.875rem}
  #acm-root .form-shell{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px 24px}
  #acm-root .form-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  #acm-root .form-toolbar .rec-select{display:flex;align-items:center;gap:8px;font-size:.875rem}
  #acm-root select.recpick{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;background:var(--input-bg);color:var(--ink);font-family:ui-monospace,monospace}
  #acm-root .btn{border:none;padding:8px 14px;border-radius:8px;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .15s}
  #acm-root .btn-primary{background:var(--accent);color:#fff}
  #acm-root .btn-primary:hover{background:var(--accent-2)}
  #acm-root .btn-ghost{background:var(--line);color:var(--ink-light)}
  #acm-root .btn-ghost:hover{background:#d1d5db}
  #acm-root .btn-danger{background:#fee2e2;color:var(--crit)}
  #acm-root .btn-danger:hover{background:#fca5a5}
  #acm-root .btn-solid-danger{background:var(--crit);color:#fff}
  #acm-root .btn-solid-danger:hover{background:#b91c1c}
  #acm-root .btn-row{display:flex;gap:8px}
  #acm-root .btn-export-excel{background-color:var(--ok);color:#ffffff;font-size:.875rem;font-weight:700;padding:8px 16px;border-radius:4px;border:none;cursor:pointer;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
  #acm-root .btn-export-excel:hover{background-color:#047857}
  #acm-root .btn-export-excel svg{width:16px;height:16px}
  #acm-root .sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;transition:all .2s}
  #acm-root .sec>.sec-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
  #acm-root .grid{display:grid;gap:10px}
  #acm-root .g1{grid-template-columns:1fr}
  #acm-root .g2{grid-template-columns:1fr 1fr}
  #acm-root .g3{grid-template-columns:1fr 1fr 1fr}
  #acm-root .g4{grid-template-columns:1fr 1fr 1fr 1fr}
  #acm-root .g5{grid-template-columns:repeat(5,1fr)}
  #acm-root .g6{grid-template-columns:repeat(6,1fr)}
  @media (max-width:720px){#acm-root .g2,#acm-root .g3,#acm-root .g4,#acm-root .g5,#acm-root .g6{grid-template-columns:1fr}}
  #acm-root label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--ink-light);font-weight:600}
  #acm-root input[type=text],#acm-root input[type=date],#acm-root input[type=time],#acm-root input[type=number],#acm-root textarea,#acm-root select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:.75rem;font-family:inherit;color:var(--ink);background:var(--input-bg);transition:all .2s}
  #acm-root select[multiple]{padding:4px 6px}
  #acm-root textarea{resize:vertical;min-height:54px}
  #acm-root .check-row,#acm-root .radio-row{display:flex;flex-wrap:wrap;gap:12px}
  #acm-root .chk,#acm-root .rad{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--ink-light);cursor:pointer}
  #acm-root .chk input,#acm-root .rad input{width:15px;height:15px;accent-color:var(--accent)}
  #acm-root table.editrows{width:100%;border-collapse:collapse;margin-top:6px}
  #acm-root table.editrows input, #acm-root table.editrows select, #acm-root table.editrows textarea{width:100%;font-size:.75rem}
  #acm-root table.editrows textarea{padding:4px;resize:vertical;font-family:inherit}
  #acm-root .err-highlight,#acm-root .err-sec{border:1px solid var(--crit)!important;background-color:#fef2f2!important;box-shadow:0 0 0 1px var(--crit)}
  #acm-root #acm-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,24,39,.7);z-index:99999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)}
  #acm-root #acm-modal-overlay.active{opacity:1;pointer-events:auto}
  #acm-root #acm-modal-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:90%;max-width:420px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(12px);transition:transform .2s ease}
  #acm-root #acm-modal-overlay.active #acm-modal-box{transform:translateY(0)}
  #acm-root #acm-modal-title{font-size:1rem;font-weight:800;color:var(--ink);margin-bottom:8px}
  #acm-root #acm-modal-msg{font-size:.875rem;color:var(--ink-light);margin-bottom:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  #acm-root #acm-modal-input{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px;font-size:.875rem;font-family:inherit;color:var(--ink);background:var(--input-bg);outline:none;display:none}
  #acm-root #acm-modal-input:focus{border-color:var(--accent)}
  #acm-root #acm-modal-actions{display:flex;justify-content:flex-end;gap:8px}

  /* Custom Hover Tooltip */
  #acm-custom-tooltip { position: fixed; background: rgba(17, 24, 39, 0.95); color: #fff; padding: 12px; border-radius: 8px; pointer-events: none; font-size: 11px; z-index: 999999; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); line-height: 1.5; white-space: pre-wrap; transition: opacity 0.15s ease; opacity: 0; }
  #acm-custom-tooltip.show { opacity: 1; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>

<body>
<div id="acm-root"></div>
<script>
(function () {
  const ROOT = document.getElementById('acm-root');
  const STORE_KEY = 'acm-records-v1';
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzdN6zevwwWW0QfnSXnHCAt5dXFv8NzDyq1nGNCMb_ogxo8zFeADGnFFDmuGxM5Hk/exec";
  const COMPRESSED_DB = {}; 
  const EQUIP_DB = {};
  for(const line in COMPRESSED_DB){
    EQUIP_DB[line]={};
    for(const desc in COMPRESSED_DB[line]){
      COMPRESSED_DB[line][desc].forEach(no=>{EQUIP_DB[line][no]=desc;});
    }
  }
  const CONF_PASS = {'Anisah':'134510','Azlan':'111306','Eylia':'131091','Fairus':'123092','Fariz':'134828','Hafizah':'134449','Khairoulnizam':'110143','Samsulnazri':'111289','Zahidah':'131530','Zulkiple':'133513'};
  const CONF_NAMES = Object.keys(CONF_PASS).sort();
  const ISSUED_PASS = {'Anisah':'134510','Eylia':'131091','Fairus':'123092','Fariz':'134828','Hafizah':'134449','Liana':'119018','Qabsha':'133569','Zulkiple':'133513'};
  const ISSUED_NAMES = Object.keys(ISSUED_PASS).sort();
  const CATS = { mech:'Mechanical', elec:'Electrical', it:'IT', operation:'Operation', others:'Others' };
  const URGENCY = { '1month':'1 month', '3months':'3 months', '6months':'6 months', '12months':'12 months' };
  const URGENCY_MS = { '1month': 30*86400000, '3months': 90*86400000, '6months': 180*86400000, '12months': 365*86400000 };
  const GROUP_OPTIONS = ['Shift A', 'Shift B', 'Shift C', 'Shift D', 'OH', 'Vendor'];
  const MAIN_CAT_OPTIONS = ['Conveyor Line', 'Vehicle', 'Equipment/Tool', 'Facility', 'Maintenance', 'Other'];
  const VENDOR_OPTS = ['OMNI', 'CPT', 'SD Prima', 'CPT Kauffman', 'ABS', 'CTwo Engineering', 'Syswin', 'Other'];
  const CLASSIFICATION_OPTS = ['Manpower Management', 'Contract Management', 'Cost & Budget Management', 'Vendor Management'];
  
  const BLANK_TABS = ['Manpower Management', 'Cost & Budget Management'];
  const ALL_TABS = ['Dashboard', 'Record Input', 'Manpower Management', 'Contract Management', 'Cost & Budget Management', 'Vendor Management'];
  const INPUT_TABS = ['Manpower Management', 'Cost & Budget Management', 'Vendor Management'];

  const SLA_METRICS = [
      {type: 'SLA (Speed)', name: 'Emergency Response Time', target: 'On-site within 2 hours for critical failures (e.g., power outage, burst pipe).', measure: 'Time from work order dispatch to technician check-in on site.'},
      {type: 'SLA (Speed)', name: 'Routine Resolution Time', target: 'Resolved within 48 hours for non-urgent repairs.', measure: 'Time from work order creation to verified completion.'},
      {type: 'SLA (Compliance)', name: 'Preventive Maintenance (PM) Completion', target: '98% of scheduled PM tasks completed on time each month.', measure: 'Completed PM work orders divided by total scheduled PMs.'},
      {type: 'KPI (Quality)', name: 'First-Time Fix Rate (FTFR)', target: 'Above 85% of issues fixed without a repeat visit.', measure: 'Work orders closed without a follow-up ticket for the same issue within 14 days.'},
      {type: 'KPI (Reliability)', name: 'Equipment Uptime', target: '99.5% operational availability for critical machinery.', measure: 'Total operating hours minus unplanned downtime hours.'},
      {type: 'KPI (Safety)', name: 'HSE & Permit Compliance', target: '100% adherence to safety rules and Permit-to-Work (PTW) protocols.', measure: 'Number of safety audits passed without violations or near-misses.'}
  ];

  let customTooltipDiv = document.getElementById('acm-custom-tooltip');
  if (!customTooltipDiv) {
      customTooltipDiv = document.createElement('div');
      customTooltipDiv.id = 'acm-custom-tooltip';
      document.body.appendChild(customTooltipDiv);
  }

  function showModal(title, msg, type = 'alert', extraArg = false) {
    return new Promise(resolve => {
      let overlay = document.getElementById('acm-modal-overlay');
      if(!overlay){
        overlay = document.createElement('div');
        overlay.id = 'acm-modal-overlay';
        overlay.innerHTML = `<div id="acm-modal-box"><div id="acm-modal-title"></div><div id="acm-modal-msg"></div><input type="text" id="acm-modal-input" placeholder="" autocomplete="new-password"/><div id="acm-modal-actions"></div></div>`;
      }
      if(overlay.parentNode !== ROOT) ROOT.appendChild(overlay);
      const titleEl = overlay.querySelector('#acm-modal-title'), msgEl = overlay.querySelector('#acm-modal-msg'), inputEl = overlay.querySelector('#acm-modal-input'), actionsEl = overlay.querySelector('#acm-modal-actions');
      titleEl.textContent = title; msgEl.textContent = msg; 
      
      if(type === 'prompt') {
          inputEl.type = 'password';
          inputEl.placeholder = 'Enter password...';
          inputEl.style.display = 'block';
      } else if (type === 'prompt-date') {
          inputEl.type = 'date';
          inputEl.placeholder = '';
          inputEl.style.display = 'block';
      } else {
          inputEl.style.display = 'none';
      }
      
      inputEl.value = ''; actionsEl.innerHTML = '';
      function close() { overlay.classList.remove('active'); }
      const createBtn = (cls, text, cb) => { const b = document.createElement('button'); b.className = cls; b.textContent = text; b.onclick = () => { close(); cb(); }; return b; };
      
      if(type === 'alert') actionsEl.appendChild(createBtn(extraArg ? 'btn btn-danger' : 'btn btn-primary', 'OK', () => resolve(true)));
      else if(type === 'confirm'){ actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(false))); actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Delete', () => resolve(true))); }
      else if(type === 'confirm-edit'){ actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(false))); actionsEl.appendChild(createBtn('btn btn-primary', 'Edit', () => resolve(true))); }
      else if(type === 'prompt' || type === 'prompt-date'){
        actionsEl.appendChild(createBtn('btn btn-ghost', 'Cancel', () => resolve(null)));
        const handleSub = () => { close(); resolve(inputEl.value); };
        const ob = createBtn('btn btn-primary', 'Confirm', handleSub); actionsEl.appendChild(ob);
        inputEl.onkeydown = e => { if(e.key === 'Enter') handleSub(); };
      }
      else if(type === 'unsaved'){ actionsEl.appendChild(createBtn('btn btn-primary', 'Cancel & Keep Editing', () => resolve(false))); actionsEl.appendChild(createBtn('btn btn-solid-danger', 'Discard Data', () => resolve(true))); }
      
      void overlay.offsetWidth; overlay.classList.add('active'); 
      if(type === 'prompt' || type === 'prompt-date') {
          setTimeout(() => { 
              if(type === 'prompt-date' && typeof extraArg === 'string') inputEl.value = extraArg;
              inputEl.focus(); 
          }, 50);
      }
    });
  }

  function blankRecord() {
    return { createdAt: Date.now(), isDraft: true, status: '', maintenanceType: 'Contract Management', reportNo: '', happeningDate: '', ecd: '', startDate: '', endDate: '', contractDuration: '', dd:'', mm:'', yy:'', issuedBy:'', issuedGroup:'', title:'', area:'', subArea:'', areaNo:'', conveyorItem:'', lineEquipment:'', equipNo:'', cat1: {}, urgency:'', reasonDetail:'', clm: { creation: [{date:'',owner:'',status:'',remarks:''}], negotiations: [{date:'',owner:'',status:'',remarks:''}], approval: [{date:'',owner:'',status:'',remarks:''}], monitoring: {date:'',owner:'',status:'',remarks:''}, renewal: {date:'',owner:'',status:'',remarks:''} }, vendorSla: Array.from({length:6}, () => ({actual:'', status:'', pic:'', remarks:''})), vendorMonitoring: [], vendorNameBase: '', vendorNameOther: '', vendorContactPerson: '', vendorAddress: '', vendorContactNumber: '' };
  }

  let state = { tab: 'Dashboard', records: [], activeId: null, cleanActiveRecord: null, isDirty: false, loaded: false, showErrors: false, vendorSlaTableVisible: false, contractClmTableVisible: false };
  const checkReq = v => v != null && String(v).trim() !== '';

  async function loadRecords() {
    try { if (window.storage) { const res = await window.storage.get(STORE_KEY, false); if (res && res.value) state.records = JSON.parse(res.value); } } catch (e) { state.records = []; }
    window.syncGoogleSheets = function(googleData) {
      const cleanDate = iso => { if (!iso || typeof iso !== 'string' || !iso.includes('T')) return iso; const d = new Date(iso); if (isNaN(d)) return iso; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      let validData = [];
      googleData.forEach(g => {
        if (!g.createdAt || String(g.createdAt).trim() === '') return;
        g.happeningDate = cleanDate(g.happeningDate);
        g.ecd = cleanDate(g.ecd);
        g.startDate = cleanDate(g.startDate);
        g.endDate = cleanDate(g.endDate);
        
        if (g.clm && Array.isArray(g.clm)) {
            g.clm = {
                creation: Array.isArray(g.clm[0]) ? g.clm[0] : [g.clm[0] || {date:'',owner:'',status:'',remarks:''}],
                negotiations: Array.isArray(g.clm[1]) ? g.clm[1] : [ g.clm[1] || {date:'',owner:'',status:'',remarks:''} ],
                approval: Array.isArray(g.clm[2]) ? g.clm[2] : [g.clm[2] || {date:'',owner:'',status:'',remarks:''}],
                monitoring: g.clm[3] || {date:'',owner:'',status:'',remarks:''},
                renewal: g.clm[4] || {date:'',owner:'',status:'',remarks:''}
            };
        }
        
        if (!g.vendorSla || !Array.isArray(g.vendorSla)) {
            g.vendorSla = Array.from({length:6}, () => ({actual:'', status:'', pic:'', remarks:''}));
        }
        
        if (!g.vendorMonitoring) g.vendorMonitoring = [];

        validData.push(g);
      });
      const drafts = state.records.filter(r => r.isDraft);
      const cloudIds = new Set(validData.map(g => String(g.createdAt)));
      const localOffline = state.records.filter(r => !r.isDraft && !cloudIds.has(String(r.createdAt)));
      state.records = [...drafts, ...localOffline, ...validData].sort((a,b) => b.createdAt - a.createdAt);
      state.loaded = true;
      const validOrActive = state.records.filter(r => !r.isDraft || String(r.createdAt) === String(state.activeId));
      if (validOrActive.length > 0 && !state.activeId) state.activeId = validOrActive[0].createdAt;
      render();
    };
    const script = document.createElement('script');
    script.src = WEB_APP_URL + "?action=read&callback=syncGoogleSheets";
    document.body.appendChild(script);
    state.loaded = true; render();
  }

  async function saveRecords() { try { if(window.storage) await window.storage.set(STORE_KEY, JSON.stringify(state.records), false); } catch(e){} }
  function revertActiveRecord() { if(state.cleanActiveRecord && state.activeId) { const idx = state.records.findIndex(x => String(x.createdAt) === String(state.activeId)); if (idx !== -1) { state.records[idx] = JSON.parse(JSON.stringify(state.cleanActiveRecord)); saveRecords(); } } state.isDirty = false; }
  
  function getNextReportNo() {
    const prefix = `${String(new Date().getFullYear()).slice(-2)}${String(new Date().getMonth() + 1).padStart(2, '0')}-`;
    let max = 0;
    state.records.forEach(rec => { if (rec.reportNo && rec.reportNo.startsWith(prefix)) { const num = parseInt(rec.reportNo.split('-')[1], 10); if (!isNaN(num) && num > max) max = num; } });
    return prefix + String(max + 1).padStart(3, '0');
  }

  function fmtDate(r) { if (r.happeningDate) { const p = String(r.happeningDate).substring(0, 10).split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0].slice(-2)}`; } return (!r.dd && !r.mm && !r.yy) ? '—' : `${(r.dd||'--').padStart(2,'0')}/${(r.mm||'--').padStart(2,'0')}/${r.yy||'--'}`; }
  function getTs(iso) { if (iso && typeof iso === 'string') { const p = iso.split('-'); if (p.length === 3) return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])).getTime(); } return null; }
  function getOldTs(dd, mm, yy) { return (!dd || !mm || !yy) ? null : new Date(parseInt(yy.length === 2 ? ('20' + yy) : yy), parseInt(mm)-1, parseInt(dd)).getTime(); }
  function getExactTs(dateStr, oldDd, oldMm, oldYy) {
    return getTs(dateStr) || getOldTs(oldDd, oldMm, oldYy);
  }

  function getStatus(r) {
    let clmProgress = false;
    if (r.clm) {
        if (Array.isArray(r.clm)) {
            clmProgress = r.clm.some(c => c.date || c.remarks);
        } else {
            clmProgress = ['creation','approval','monitoring','renewal'].some(k => r.clm[k]?.date || r.clm[k]?.remarks) || (r.clm.negotiations && r.clm.negotiations.some(n => n.date || n.remarks));
        }
    }
    
    let slaProgress = false;
    if (r.vendorSla && Array.isArray(r.vendorSla)) {
        slaProgress = r.vendorSla.some(v => v.actual || v.status || v.remarks);
    }
    
    if (clmProgress || slaProgress) return 'progress';
    return 'open';
  }

  let timelineChart = null, categoryChart = null, urgencyChart = null;
  function ensureChartJs(cb) {
    if (window.Chart && window.html2canvas) return cb();
    if (document.getElementById('chartjs-script')) { let attempts=0, check=setInterval(()=>{ if(window.Chart && window.html2canvas){ clearInterval(check);cb(); } else if(++attempts>30){ clearInterval(check);cb(); } }, 100); return; }
    const s = document.createElement('script'); s.id = 'chartjs-script'; s.src = 'https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js'; document.head.appendChild(s);
  }

  function getFilteredDashboardRecords() {
    const sDate = document.getElementById('dash-start')?.value, eDate = document.getElementById('dash-end')?.value;
    const getSel = n => Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(cb => cb.value);
    
    const selClass = getSel('dash-class');
    const selCrit = getSel('dash-crit');
    const selCat = getSel('dash-cat');
    const selVendor = getSel('dash-vendor');
    const selDur = getSel('dash-duration');
    
    const startTs = sDate ? getTs(sDate) : 0, endTs = eDate ? (getTs(eDate) + 86400000) : Infinity;
    return state.records.filter(r => !r.isDraft).filter(r => {
      const t = getTs(r.happeningDate) || getOldTs(r.dd, r.mm, r.yy);
      if ((sDate || eDate) && (!t || t < startTs || t >= endTs)) return false;
      
      if (selClass.length && !selClass.includes(r.maintenanceType)) return false;
      
      if (selCrit.length) {
          let igBase = r.issuedGroup || '';
          if(igBase.toUpperCase().startsWith('OTHER:')) igBase = 'Other';
          if (!selCrit.includes(igBase)) return false;
      }
      
      if (selCat.length && !selCat.some(c => (r.cat1 && r.cat1[c]))) return false;
      
      if (selVendor.length) {
          let vBase = r.vendorNameBase || '';
          if (!selVendor.includes(vBase)) return false;
      }
      
      if (selDur.length && !selDur.includes(r.contractDuration)) return false;
      
      return true;
    });
  }

  function computeKPIs(activeRecs) {
    activeRecs = activeRecs || state.records.filter(r => !r.isDraft);
    const open = activeRecs.filter(r => getStatus(r) !== 'done'), completed = activeRecs.filter(r => getStatus(r) === 'done');
    let resTimes = [], catCounts = {}, ratedTotal = 0, onTime = 0;
    Object.keys(CATS).forEach(k => catCounts[CATS[k]] = 0);
    activeRecs.forEach(r => {
      if(r.cat1) Object.keys(CATS).forEach(k => { if(r.cat1[k]) catCounts[CATS[k]]++; });
    });
    completed.forEach(r => {
      const t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy);
      let t1 = getExactTs(r.updatedAt || r.createdAt);
      if(!t1) t1 = Date.now();
      if(t0 && t1 && t1 >= t0) resTimes.push((t1 - t0) / 86400000); 
      if(t0 && t1 && URGENCY_MS[r.urgency]) { ratedTotal++; if((t1 - t0) <= URGENCY_MS[r.urgency]) onTime++; }
    });
    let topCat = null, topCatCount = 0;
    Object.entries(catCounts).forEach(([k,v]) => { if(v > topCatCount) { topCat = k; topCatCount = v; } });
    return { total: activeRecs.length, openCount: open.length, completedCount: completed.length, avgRes: resTimes.length ? (resTimes.reduce((a,b)=>a+b,0)/resTimes.length) : null, criticalPending: open.filter(r => r.urgency === '1month' || r.urgency === '3months').length, topCat, topCatCount, onTimeRate: ratedTotal ? Math.round((onTime/ratedTotal)*100) : null, catCounts };
  }

  function applyTimelineFilters(chartInstance, containerId) {
      if(!chartInstance) return;
      const vD = chartInstance.isDatasetVisible(0);
      const vP = chartInstance.isDatasetVisible(1);
      const vO = chartInstance.isDatasetVisible(2);
      
      const mD = chartInstance.data._masterDone || [];
      const mP = chartInstance.data._masterProg || [];
      const mO = chartInstance.data._masterOpen || [];
      const mL = chartInstance.data._masterLabels || [];
      
      const vL = mL.filter(lbl => 
          (vD && mD.some(d => d.y === lbl)) || 
          (vP && mP.some(d => d.y === lbl)) || 
          (vO && mO.some(d => d.y === lbl))
      );
      
      chartInstance.data.labels = vL;
      chartInstance.data.datasets[0].data = vD ? mD.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[1].data = vP ? mP.filter(d => vL.includes(d.y)) : [];
      chartInstance.data.datasets[2].data = vO ? mO.filter(d => vL.includes(d.y)) : [];
      
      const cContainer = document.getElementById(containerId);
      if(cContainer) {
          const availableHeight = cContainer.clientHeight;
          const maxVisible = Math.max(1, Math.floor((availableHeight - 40) / 35));
          chartInstance.options.scales.y.min = 0;
          chartInstance.options.scales.y.max = Math.min(vL.length - 1, maxVisible - 1);
      }
      chartInstance.update();
  }

      document.querySelectorAll(`.leg-chk[value="${idx}"]`).forEach(chk => {

      }
      if (window.fullViewChart) {
          window.fullViewChart.setDatasetVisibility(idx, isVis);
          applyTimelineFilters(window.fullViewChart, 'fv-canvas-container');
      }
  }

  function updateDashboardUI() {
    const filtered = getFilteredDashboardRecords(), k = computeKPIs(filtered);
    const totalCompletionRate = k.total === 0 ? null : Math.round((k.completedCount / k.total) * 100);
    const kpiCards = [
      { l: 'Open Work Orders', v: k.openCount, c: 'var(--crit)', s: `${k.total} total filtered`, p: k.openCount>0?`<span class="kpi-pill pill-crit">Needs attention</span>`:`<span class="kpi-pill pill-ok">All clear</span>` },
      { l: 'Critical / Urgent Pending', v: k.criticalPending, c: 'var(--warn)', s: '1 & 3 Months target, open', p: k.criticalPending>0?`<span class="kpi-pill pill-warn">Prioritise</span>`:`<span class="kpi-pill pill-ok">None pending</span>` },
      { l: 'Top Fault Category', v: k.topCat || '—', c: 'var(--accent-2)', s: k.topCat ? `${k.topCatCount} occurrence${k.topCatCount===1?'':'s'} logged` : 'No category data yet', p: '' },
      { l: 'Total Completion', v: totalCompletionRate===null?'—':(totalCompletionRate+'%'), c: 'var(--accent)', s: `${k.completedCount} of ${k.total} job${k.total===1?'':'s'} done`, p: totalCompletionRate===100?`<span class="kpi-pill pill-ok">Perfect</span>`:'' },
      { l: 'On-Time Completion', v: k.onTimeRate===null?'—':(k.onTimeRate+'%'), c: 'var(--ok)', s: k.onTimeRate===null?'No rated completions yet':'vs. exact SLA target', p: k.onTimeRate!==null?(k.onTimeRate>=80?`<span class="kpi-pill pill-ok">On target</span>`:`<span class="kpi-pill pill-warn">Below target</span>`):'', tooltip: `Avg. Resolution Time: ${k.avgRes===null?'—':(k.avgRes.toFixed(1)+' days')} (across ${k.completedCount} completed jobs)` }
    ];
    
    const gridEl = document.getElementById('dash-kpi-grid');
    if (gridEl) gridEl.innerHTML = kpiCards.map(c => `<div class="kpi-card" ${c.tooltip ? `data-tooltip="${c.tooltip}"` : ''}><div class="bar" style="background:${c.c}"></div><div class="kpi-label">${c.l}</div><div class="kpi-value">${c.v}</div><div class="kpi-sub">${c.s}</div>${c.p}</div>`).join('');

    const rows = filtered.slice().sort((a,b)=>b.createdAt-a.createdAt).map(r => {
      const st = getStatus(r), urg = URGENCY[r.urgency] || '—';
      let catList = [];
      if(r.cat1) Object.keys(CATS).forEach(k => { if(r.cat1[k]) catList.push(CATS[k]); });
      return `<tr><td><button class="link-btn mono-font" data-act="open" data-id="${r.createdAt}" style="text-decoration:underline;padding:0;text-align:left;font-weight:700">${r.reportNo||'—'}</button></td><td class="mono-font">${fmtDate(r)}</td><td>${r.title||'<span style="color:var(--line-dark)">Untitled</span>'}</td><td>${r.lineEquipment||'—'}</td><td>${r.equipNo||'—'}</td><td>${r.conveyorItem||'—'}</td><td>${catList.length?catList.join(', '):'—'}</td><td>${urg}</td><td><span class="status-chip ${st==='done'?'chip-done':st==='progress'?'chip-progress':'chip-open'}">${st==='done'?'Completed':st==='progress'?'In progress':'Open'}</span></td></tr>`;
    }).join('');
    
    const tContainer = document.getElementById('dash-table-container');
    if (tContainer) tContainer.innerHTML = filtered.length===0?`<div class="empty-state">No record found matching filters.</div>`:`<table class="list"><thead><tr><th>Record No.</th><th>Date Issued</th><th>Title</th><th>Line/Equipment</th><th>No.</th><th>Conveyor/Item</th><th>Category</th><th>Urgency</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;

    document.querySelectorAll('[data-act="open"]').forEach(btn => { 
        btn.addEventListener('click', () => { 
            const id = String(btn.getAttribute('data-id'));
            state.activeId = id; 
            state.tab = 'Record Input';
            render(); 
        });
    });

    if (timelineChart) {
      const nowTs = new Date().setHours(23, 59, 59, 999), timelineFiltered = filtered.slice().sort((a,b) => b.createdAt - a.createdAt);
      const tlLabels = [], dsDone = [], dsProg = [], dsOpen = [], masterMilestones = [];
      let globalMinT = nowTs, globalMaxT = nowTs;
      
      const doneBg = 'rgba(5, 150, 105, 0.45)', doneBc = 'rgba(5, 150, 105, 1)';
      const progBg = 'rgba(217, 119, 6, 0.45)', progBc = 'rgba(217, 119, 6, 1)';

      timelineFiltered.forEach(r => { 
        let t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy); 
        if (t0 && !isNaN(t0) && t0 < globalMinT) globalMinT = t0; 
      });
      
      timelineFiltered.forEach(r => {
        let t0 = getExactTs(r.happeningDate, r.dd, r.mm, r.yy) || parseInt(r.createdAt, 10); if(isNaN(t0)) t0 = nowTs;
        let statusLogic = getStatus(r);
        let endOfAction = statusLogic === 'done' ? (getExactTs(r.updatedAt || r.createdAt) || nowTs) : nowTs;
        
        let totalX = [t0, endOfAction];
        let targetT = t0 + (URGENCY_MS[r.urgency] || 0);
        
        let labelStr = r.reportNo || 'Draft'; while (tlLabels.includes(labelStr)) labelStr += '\u200B'; 
        tlLabels.push(labelStr);
        
        const dsTarget = statusLogic === 'done' ? dsDone : (statusLogic === 'progress' ? dsProg : dsOpen);
        const activeBg = statusLogic === 'done' ? doneBg : (statusLogic === 'progress' ? progBg : 'transparent');
        const activeBc = statusLogic === 'done' ? doneBc : (statusLogic === 'progress' ? progBc : 'transparent');

        const barData = { x: [t0, endOfAction], y: labelStr, _r: r, _totalX: totalX, _bg: activeBg, _bc: activeBc };
        
        if (statusLogic === 'open') {
            dsTarget.push({ ...barData, _bg: 'transparent', _bc: 'transparent', _isOpenLine: true, _t0: t0, _t1: endOfAction });
        } else {
            dsTarget.push({ ...barData, _isActionBox: true });
        }

        // --- Extract Milestones ---
        if (r.clm) {
            const extract = (arr, title) => {
                if(Array.isArray(arr)) {
                    arr.forEach(item => {
                        if(item && item.date) {
                             const mTs = getTs(item.date);
                             if (mTs) {
                                 masterMilestones.push({ y: labelStr, t: mTs, dateStr: item.date, title: title, pic: item.owner, status: item.status, remarks: item.remarks });
                                 if (mTs > globalMaxT) globalMaxT = mTs;
                             }
                        }
                    });
                }
            };
            extract(r.clm.creation, 'CLM Stage: Creation (Drafting/Authoring)');
            extract(r.clm.negotiations, 'CLM Stage: Negotiation & Collaboration');
            extract(r.clm.approval, 'CLM Stage: Approval & Signature (Execution)');
        }
        if (r.vendorMonitoring && Array.isArray(r.vendorMonitoring)) {
            r.vendorMonitoring.forEach(hist => {
                 if(hist && hist.date) {
                     const mTs = getTs(hist.date);
                     if (mTs) {
                         const hasNotMet = hist.metrics && hist.metrics.some(m => m.status === 'Not Met');
                         const calcStatus = hasNotMet ? 'Breach' : 'Active';
                         const pics = [...new Set((hist.metrics || []).map(m => m.pic).filter(x => x && x.trim() !== ''))].join(', ');
                         const remarks = [...new Set((hist.metrics || []).map(m => m.remarks).filter(x => x && x.trim() !== ''))].join(' | ');
                         
                         masterMilestones.push({ y: labelStr, t: mTs, dateStr: hist.date, title: 'Vendor Monitoring History', pic: pics, status: calcStatus, remarks: remarks });
                         if (mTs > globalMaxT) globalMaxT = mTs;
                     }
                 }
            });
        }
        
        let endTs = r.endDate ? getTs(r.endDate) : null;
        if (endTs && endTs > globalMaxT) globalMaxT = endTs;
        if (targetT > globalMaxT) globalMaxT = targetT;
        if (endOfAction > globalMaxT) globalMaxT = endOfAction;
      });
      
      timelineChart.data._masterLabels = tlLabels; 
      timelineChart.data._masterDone = dsDone; 
      timelineChart.data._masterProg = dsProg; 
      timelineChart.data._masterOpen = dsOpen;
      timelineChart.data._masterMilestones = masterMilestones;
      
      const isD = document.querySelector('#timeline-custom-legend .leg-chk[value="0"]')?.checked ?? true;
      const isP = document.querySelector('#timeline-custom-legend .leg-chk[value="1"]')?.checked ?? true;
      const isO = document.querySelector('#timeline-custom-legend .leg-chk[value="2"]')?.checked ?? true;
      timelineChart.setDatasetVisibility(0, isD);
      timelineChart.setDatasetVisibility(1, isP);
      timelineChart.setDatasetVisibility(2, isO);
      
      applyTimelineFilters(timelineChart, 'timeline-scroll-container');
      
      const dMin = new Date(globalMinT); dMin.setHours(0,0,0,0);
      const dMax = new Date(globalMaxT); dMax.setHours(0,0,0,0); dMax.setDate(dMax.getDate() + 1);
      timelineChart.options.scales.x.min = timelineFiltered.length ? dMin.getTime() : nowTs - 86400000;
      timelineChart.options.scales.x.max = timelineFiltered.length ? dMax.getTime() : nowTs + 86400000;
      
      const tlEmpty = document.getElementById('timeline-empty-state');
      const tlContainer = document.getElementById('timeline-scroll-container');
      if (tlContainer && tlEmpty) { 
        if (timelineFiltered.length === 0 || timelineChart.data.labels.length === 0) { 
          tlEmpty.style.display = 'block'; tlContainer.style.display = 'none';
        } else { 
          tlEmpty.style.display = 'none'; tlContainer.style.display = 'block';
          timelineChart.update(); 
          if(window.enablePan) window.enablePan('acm-timeline-chart');
        } 
      }
    }
    if (categoryChart) {
      let cat1CountsArr = [];
      const selCatNames = Array.from(document.querySelectorAll('input[name="dash-cat"]:checked')).map(cb => CATS[cb.value]).filter(Boolean);
      
      Object.entries(CATS).forEach(([k, name]) => {
          let count = 0;
          filtered.forEach(r => { if(r.cat1 && r.cat1[k]) count++; });
          if(selCatNames.length === 0 || selCatNames.includes(name)) cat1CountsArr.push({name: name, count: count});
      });
      
      cat1CountsArr.sort((a,b) => b.count - a.count);
      
      categoryChart.data.labels = cat1CountsArr.map(x => x.name);
      categoryChart.data.datasets[0].data = cat1CountsArr.map(x => x.count);
      categoryChart.data.datasets[0].backgroundColor = cat1CountsArr.map(() => 'rgba(37, 99, 235, 0.45)');
      categoryChart.data.datasets[0].borderColor = cat1CountsArr.map(() => 'rgba(37, 99, 235, 1)');
      categoryChart.options.plugins.verticalLine = false;
      categoryChart.update();
    }
    if (urgencyChart) {
      const uCounts = { '1month': 0, '3months': 0, '6months': 0, '12months': 0 };
      filtered.forEach(r => { if(r.urgency && uCounts[r.urgency] !== undefined) uCounts[r.urgency]++; });
      urgencyChart.data.datasets[0].data = [uCounts['1month'], uCounts['3months'], uCounts['6months'], uCounts['12months']]; urgencyChart.update();
    }
  }

  function setupDropdownFilters(wrapperId, defaultText) {

    const btn = wrapper.querySelector('.dd-btn'), menu = wrapper.querySelector('.dd-menu'), checkboxes = menu.querySelectorAll('input[type="checkbox"]');

  function bindJPEGExport(btnId, fileName, targetId = null) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      if (typeof html2canvas === 'undefined') { alert("Export library is loading. Try again in a few seconds."); return; }
      const panel = targetId ? document.getElementById(targetId) : btn.closest('.panel');
      
      const toolbar = panel.querySelector('.fv-toolbar-actions');
      if (toolbar) toolbar.style.display = 'none';

      let oH = '', oO = '';
      if(targetId) { 
          oH = panel.style.height; oO = panel.style.overflowY; 
          panel.style.height = 'auto'; panel.style.overflowY = 'visible'; 
      } else {
          const scrollWrap = panel.querySelector('.chart-wrap');
          if(scrollWrap) { oH = scrollWrap.style.height; oO = scrollWrap.style.overflowY; scrollWrap.style.height = 'auto'; scrollWrap.style.overflowY = 'visible'; }
      }

      const originalDisplay = btn.style.display; btn.style.display = 'none';
      html2canvas(panel, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
        btn.style.display = originalDisplay;
        if (toolbar) toolbar.style.display = 'flex';
        
        if(targetId) {
            panel.style.height = oH; panel.style.overflowY = oO;
        } else {
            const scrollWrap = panel.querySelector('.chart-wrap');
            if(scrollWrap) { scrollWrap.style.height = oH; scrollWrap.style.overflowY = oO; }
        }
        
        const link = document.createElement("a"); link.href = canvas.toDataURL('image/jpeg', 1.0); link.download = fileName; document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }).catch(err => { 
        console.error(err); btn.style.display = originalDisplay; 
        if (toolbar) toolbar.style.display = 'flex';
      });
    });
  }

  function createTimelineChart(ctx) {
      return new Chart(ctx, {
          type: 'bar',
          plugins: [{ 
            id:'customCanvasBackgroundColor', 
            beforeDraw:(chart, args, options)=>{ 
                const ctx = chart.ctx; 
                ctx.save(); 
                ctx.fillStyle = options.color || '#ffffff'; 
                ctx.fillRect(0,0,chart.width,chart.height); 
                ctx.restore(); 
            } 
          }, {
            id: 'customTimelineDrawings',
            afterDatasetsDraw(chart) {
              const ctx = chart.ctx, xAxis = chart.scales.x, yAxis = chart.scales.y;
              const URG_COLORS = { '1month': '#dc2626', '3months': '#d97706', '6months': '#eab308', '12months': '#2563eb' };
              const drawnUrgency = new Set();
              
              ctx.save();
              ctx.beginPath();
              ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
              ctx.clip();

              chart.data.datasets.forEach((dataset, i) => {
                if (i !== 0 && i !== 1 && i !== 2) return; 
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((bar, index) => {
                  const raw = dataset.data[index];
                  if (!raw || !raw._r) return;
                  const r = raw._r;
                  const yCenter = bar.y, h = bar.height;
                  
                  // 1. Gray line for OPEN records (Current baseline logic)
                  if (raw._isOpenLine) {
                      const startX = xAxis.getPixelForValue(raw._t0);
                      const endX = xAxis.getPixelForValue(raw._t1);
                      ctx.beginPath(); ctx.moveTo(startX, yCenter); ctx.lineTo(endX, yCenter);
                      ctx.lineWidth = 2; ctx.strokeStyle = '#9ca3af'; ctx.stroke();
                      ctx.beginPath(); ctx.arc(startX, yCenter, Math.min(h / 3, 5), 0, 2 * Math.PI);
                      ctx.fillStyle = '#9ca3af'; ctx.fill();
                  }

                  // 2. Urgency Dashed Box (Procurement Phase)
                  const memoId = r.createdAt;
                  if (!drawnUrgency.has(memoId)) {
                      drawnUrgency.add(memoId);
                      const t0 = raw._totalX[0], durMs = URGENCY_MS[r.urgency] || 0;
                      if (durMs > 0) {
                        const targetT = t0 + durMs, startX = xAxis.getPixelForValue(t0), endX = xAxis.getPixelForValue(targetT);
                        const w = endX - startX, boxH = h + 8, boxY = yCenter - boxH/2;
                        ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = URG_COLORS[r.urgency] || '#9ca3af'; 
                        if(ctx.roundRect) { ctx.roundRect(startX, boxY, w, boxH, 6); } else { ctx.rect(startX, boxY, w, boxH); }
                        ctx.stroke();
                      }
                      
                      // 3. Contract Duration Dashed Box
                      let startTs = r.startDate ? getTs(r.startDate) : null;
                      let endTs = r.endDate ? getTs(r.endDate) : null;
                      if (startTs && endTs) {
                          const sx = xAxis.getPixelForValue(startTs);
                          const ex = xAxis.getPixelForValue(endTs);
                          const w = ex - sx;
                          ctx.beginPath();
                          ctx.setLineDash([4, 4]);
                          ctx.lineWidth = 1.5;
                          ctx.strokeStyle = '#8b5cf6'; // Purple
                          ctx.strokeRect(sx, yCenter - (h/2 + 6), w, h + 12);
                      }

                      // 4. Contract Execution Solid Bar (Overlay)
                      let signedTs = null;
                      if (r.clm && Array.isArray(r.clm.approval)) {
                          const signedItem = r.clm.approval.slice().reverse().find(a => a.status === 'Signed');
                          if (signedItem && signedItem.date) signedTs = getTs(signedItem.date);
                      }
                      let ecdTs = r.ecd ? getTs(r.ecd) : null;
                      
                      if (signedTs && startTs && endTs) {
                          let contractStart = (ecdTs && signedTs > ecdTs) ? signedTs : startTs;
                          const sx = xAxis.getPixelForValue(contractStart);
                          const ex = xAxis.getPixelForValue(endTs);
                          const w = ex - sx;
                          const barH = Math.max(4, h * 0.4); 
                          
                          ctx.setLineDash([]);
                          ctx.fillStyle = 'rgba(59, 130, 246, 0.65)'; 
                          ctx.strokeStyle = 'rgba(37, 99, 235, 1)';   
                          ctx.lineWidth = 1;
                          
                          ctx.beginPath();
                          if(ctx.roundRect) {
                              ctx.roundRect(sx, yCenter - barH/2, w, barH, 4);
                          } else {
                              ctx.rect(sx, yCenter - barH/2, w, barH);
                          }
                          ctx.fill(); ctx.stroke();
                      }
                  }
                  
                  // 5. Draw Milestone Circles & Dates
                  if (chart.data._masterMilestones) {
                      const milestones = chart.data._masterMilestones.filter(m => m.y === raw.y);
                      
                      const uniqueTimes = new Set(); // Prevent exact overlapping visually
                      
                      milestones.forEach(m => {
                          const sx = xAxis.getPixelForValue(m.t);
                          if (sx >= chart.chartArea.left && sx <= chart.chartArea.right) {
                              
                              if (!uniqueTimes.has(m.t)) {
                                  uniqueTimes.add(m.t);
                                  ctx.setLineDash([]);
                                  ctx.beginPath();
                                  ctx.arc(sx, yCenter, 4.5, 0, 2 * Math.PI);
                                  ctx.fillStyle = '#ffffff';
                                  ctx.fill();
                                  ctx.lineWidth = 2.5;
                                  ctx.strokeStyle = '#8b5cf6'; 
                                  ctx.stroke();

                                  const dObj = new Date(m.t);
                                  const dateStr = dObj.getDate() + ' ' + dObj.toLocaleString('default', { month: 'short' });
                                  ctx.font = 'bold 9.5px sans-serif';
                                  ctx.fillStyle = '#4b5563';
                                  ctx.textAlign = 'center';
                                  ctx.textBaseline = 'middle';
                                  ctx.fillText(dateStr, sx, yCenter + (h / 2) + 10);
                              }
                          }
                      });
                  }
                });
              });
              ctx.restore();
            }
          }],
          data: { 
              labels:[], 
              datasets:[
                  {label:'Completed', data:[], backgroundColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 0.45)', borderColor: c => (c.raw && c.raw._isOpenLine) ? 'transparent' : 'rgba(5, 150, 105, 1)', borderWidth:1, borderRadius:6, borderSkipped:false, barPercentage:0.45},

        window.fullViewChart.data._masterDone = timelineChart.data._masterDone;
        window.fullViewChart.data._masterProg = timelineChart.data._masterProg;
        window.fullViewChart.data._masterOpen = timelineChart.data._masterOpen;
        window.fullViewChart.data._masterMilestones = timelineChart.data._masterMilestones;
        
        const isD = document.querySelector('#timeline-custom-legend .leg-chk[value="0"]')?.checked ?? true;
        const isP = document.querySelector('#timeline-custom-legend .leg-chk[value="1"]')?.checked ?? true;
        const isO = document.querySelector('#timeline-custom-legend .leg-chk[value="2"]')?.checked ?? true;

        window.fullViewChart.setDatasetVisibility(1, isP);

    document.getElementById('full-view-close-btn').addEventListener('click', () => { document.getElementById('full-view-overlay').style.display = 'none'; });

    bindJPEGExport('save-chart-btn', 'Record_Timeline.jpg');
    bindJPEGExport('save-cat-btn', 'Fault_Category.jpg');
    bindJPEGExport('save-urg-btn', 'Urgency_Distribution.jpg');
    bindJPEGExport('full-view-export-btn', 'Record_Timeline_FullView.jpg', 'full-view-modal-content');

    ensureChartJs(() => {
      if(typeof Chart === 'undefined') { const errDiv = document.getElementById('timeline-scroll-container'); if(errDiv) errDiv.innerHTML = `<div style="text-align:center;padding-top:40px;color:#dc2626;font-weight:bold;font-size:14px;">Chart.js could not be loaded. Please check your network or firewall.</div>`; return; }

      window.enablePan = function(canvasId) {
          const canvas = document.getElementById(canvasId);
          if (!canvas || canvas.dataset.panEnabled) return;
          canvas.dataset.panEnabled = "true";

          let startX, startY, initXMin, initXMax, initYMin, initYMax;
          const tooltip = document.getElementById('acm-custom-tooltip');

          canvas.addEventListener('pointerdown', e => {
              const chartInstance = Chart.getChart(canvas);
              if (!chartInstance) return;
              canvas.setPointerCapture(e.pointerId);
              startX = e.clientX;
              startY = e.clientY;
              initXMin = chartInstance.options.scales.x.min ?? chartInstance.scales.x.min;
              initXMax = chartInstance.options.scales.x.max ?? chartInstance.scales.x.max;
              initYMin = chartInstance.options.scales.y.min || 0;
              initYMax = chartInstance.options.scales.y.max !== undefined ? chartInstance.options.scales.y.max : (chartInstance.data.labels.length - 1);
              canvas.style.cursor = 'grabbing';
              canvas.dataset.isDragging = "true";
              if (tooltip) tooltip.classList.remove('show');
          });

          canvas.addEventListener('pointermove', e => {
              const chartInstance = Chart.getChart(canvas);
              if (!chartInstance) return;

              // Tooltip Hover Engine
              if (canvas.dataset.isDragging !== "true" && tooltip) {
                  const rect = canvas.getBoundingClientRect();
                  const x = e.clientX - rect.left;
                  const y = e.clientY - rect.top;
                  const xAxis = chartInstance.scales.x;
                  const yAxis = chartInstance.scales.y;
                  let showTooltip = false, html = '';

                  // 1. Over Y-Axis
                  if (x >= 0 && x <= yAxis.right && y >= yAxis.top && y <= yAxis.bottom) {
                      const val = yAxis.getValueForPixel(y);
                      if (val >= 0 && val < chartInstance.data.labels.length) {
                           const labelStr = chartInstance.data.labels[val];
                           const rawData = [...chartInstance.data._masterDone, ...chartInstance.data._masterProg, ...chartInstance.data._masterOpen].find(d => d.y === labelStr);
                           if (rawData && rawData._r) {
                               html = buildRecordTooltip(rawData._r);
                               showTooltip = true;
                           }
                      }
                  } 
                  // 2. Over Chart Area (Milestone Check)
                  else if (x > yAxis.right && x <= xAxis.right && y >= yAxis.top && y <= yAxis.bottom) {
                      const val = yAxis.getValueForPixel(y);
                      const time = xAxis.getValueForPixel(x);
                      const labelStr = chartInstance.data.labels[val];
                      
                      if (labelStr && chartInstance.data._masterMilestones) {
                           const msPerPx = (xAxis.max - xAxis.min) / xAxis.width;
                           const threshold = msPerPx * 15; 
                           const yTargetPx = yAxis.getPixelForValue(val);
                           
                           if (Math.abs(y - yTargetPx) < 15) {
                               const milestones = chartInstance.data._masterMilestones.filter(m => m.y === labelStr);
                               for (let m of milestones) {
                                   if (Math.abs(m.t - time) < threshold) {
                                        html = buildMilestoneTooltip(m);
                                        showTooltip = true;
                                        break;
                                   }
                               }
                           }
                      }
                  }

                  if (showTooltip) {
                      tooltip.innerHTML = html;
                      tooltip.classList.add('show');
                      tooltip.style.display = 'block';
                      tooltip.style.left = (e.clientX + 15) + 'px';
                      tooltip.style.top = (e.clientY + 15) + 'px';
                  } else {
                      tooltip.classList.remove('show');
                      setTimeout(() => { if (!tooltip.classList.contains('show')) tooltip.style.display = 'none'; }, 150);
                  }
              }

              // Panning Engine
              if (!canvas.hasPointerCapture(e.pointerId) || canvas.dataset.isDragging !== "true") return;
              
              const diffX = e.clientX - startX;
              const diffY = e.clientY - startY;

              const xAxis = chartInstance.scales.x;
              const msPerPx = (initXMax - initXMin) / xAxis.width;
              chartInstance.options.scales.x.min = initXMin - (diffX * msPerPx);
              chartInstance.options.scales.x.max = initXMax - (diffX * msPerPx);

              const yAxis = chartInstance.scales.y;
              const labelsLen = chartInstance.data.labels.length;
              if (labelsLen > 0) {
                  const visibleCount = initYMax - initYMin + 1;
                  const pxPerItem = yAxis.height / visibleCount;
                  let shiftY = -Math.round(diffY / pxPerItem);
                  
                  let newMin = initYMin + shiftY;
                  let newMax = initYMax + shiftY;
                  
                  if (newMin < 0) {
                      newMax -= newMin;
                      newMin = 0;
                  }
                  if (newMax >= labelsLen) {
                      const excess = newMax - (labelsLen - 1);
                      newMin -= excess;
                      newMax = labelsLen - 1;
                      if (newMin < 0) newMin = 0;
                  }
                  chartInstance.options.scales.y.min = newMin;
                  chartInstance.options.scales.y.max = newMax;
              }
              chartInstance.update('none');
          });

          canvas.addEventListener('pointerup', e => {
              canvas.releasePointerCapture(e.pointerId);
              canvas.style.cursor = 'grab';
              canvas.dataset.isDragging = "false";
          });

          canvas.addEventListener('pointerleave', () => {
              if (tooltip) {
                  tooltip.classList.remove('show');
                  setTimeout(() => { if (!tooltip.classList.contains('show')) tooltip.style.display = 'none'; }, 150);
              }
          });

          canvas.addEventListener('wheel', e => {
              e.preventDefault();
              const chartInstance = Chart.getChart(canvas);
              if (!chartInstance) return;

              const zoomIntensity = 0.1;
              const zoomDir = e.deltaY < 0 ? 1 : -1;
              const xAxis = chartInstance.scales.x;
              const yAxis = chartInstance.scales.y;
              const rect = canvas.getBoundingClientRect();
              const mouseX = e.clientX - rect.left;
              const mouseY = e.clientY - rect.top;

              let curXMin = chartInstance.options.scales.x.min ?? xAxis.min;
              let curXMax = chartInstance.options.scales.x.max ?? xAxis.max;
              const xRange = curXMax - curXMin;
              const xRatio = Math.max(0, Math.min(1, (mouseX - xAxis.left) / xAxis.width));
              const xDelta = xRange * zoomIntensity * zoomDir;
              
              chartInstance.options.scales.x.min = curXMin + xDelta * xRatio;
              chartInstance.options.scales.x.max = curXMax - xDelta * (1 - xRatio);

              const labelsLen = chartInstance.data.labels.length;
              if (labelsLen > 0) {
                  let curYMin = chartInstance.options.scales.y.min ?? 0;
                  let curYMax = chartInstance.options.scales.y.max ?? (labelsLen - 1);
                  const yRange = curYMax - curYMin;
                  
                  if (zoomDir === -1 && curYMin <= 0 && curYMax >= labelsLen - 1) {
                  } else {
                      const yRatio = Math.max(0, Math.min(1, (mouseY - yAxis.top) / yAxis.height));
                      const yDelta = Math.max(1, yRange * zoomIntensity) * zoomDir;

                      let newYMin = curYMin + yDelta * yRatio;
                      let newYMax = curYMax - yDelta * (1 - yRatio);

                      if (zoomDir === -1) {
                          if (newYMin < 0) { newYMax -= newYMin; newYMin = 0; }
                          if (newYMax >= labelsLen) { newYMin -= (newYMax - (labelsLen - 1)); newYMax = labelsLen - 1; if (newYMin < 0) newYMin = 0; }
                      }

                      if (newYMax - newYMin >= 1) { 
                          chartInstance.options.scales.y.min = Math.max(0, Math.floor(newYMin));
                          chartInstance.options.scales.y.max = Math.min(labelsLen - 1, Math.ceil(newYMax));
                      }
                  }
              }
              chartInstance.update('none');
          }, { passive: false });

          canvas.addEventListener('dblclick', () => {
              if (canvasId === 'acm-timeline-chart') updateDashboardUI();
              else document.getElementById('full-view-btn').click();
          });
          
          canvas.style.cursor = 'grab';
      };

      const customBgPlugin = { id:'customCanvasBackgroundColor', beforeDraw:(c, a, o)=>{ const ctx=c.ctx; ctx.save(); ctx.globalCompositeOperation='destination-over'; ctx.fillStyle=o.color||'#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.restore(); } };

      const verticalLinePlugin = {
        id: 'verticalLine',
        afterDraw: chart => {
          const xIndex = chart.config.options.plugins?.verticalLine?.index;
          if (xIndex === undefined || xIndex <= 0 || xIndex >= chart.data.labels.length) return;
          const ctx = chart.ctx;
          const xAxis = chart.scales.x;
          const yAxis = chart.scales.y;
          const leftTick = xAxis.getPixelForTick(xIndex - 1);
          const rightTick = xAxis.getPixelForTick(xIndex);
          if (leftTick === undefined || rightTick === undefined) return;
          const xPos = (leftTick + rightTick) / 2;
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(xPos, yAxis.top);
          ctx.lineTo(xPos, yAxis.bottom);
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = '#9ca3af';
          ctx.stroke();
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = '#6b7280';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText('CATEGORY', (xAxis.left + xPos) / 2, yAxis.top + 5);
          ctx.fillText('TYPE', (xPos + xAxis.right) / 2, yAxis.top + 5);
          ctx.restore();
        }
      };

      const tlCtx = document.getElementById('acm-timeline-chart'); 
      if(tlCtx) {
          if (timelineChart) timelineChart.destroy();
          timelineChart = createTimelineChart(tlCtx);
      }
      
      const catCtx = document.getElementById('acm-category-chart');
      if (catCtx) {
        if(categoryChart) categoryChart.destroy();
        categoryChart = new Chart(catCtx, { 
          type: 'bar', 
          plugins:[customBgPlugin], 
          data: { labels:[], datasets:[{label:'Occurrences', data:[], backgroundColor:[], borderColor:[], borderWidth:1, borderRadius:4}] }, 
          options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{backgroundColor:'rgba(17, 24, 39, 0.95)', titleFont:{size:13, weight:'bold'}, bodyFont:{size:12}, padding:10, cornerRadius:8}}, scales:{y:{beginAtZero:true, title:{display:true, text:'Total Memo', font:{size:12, weight:'bold'}}, ticks:{stepSize:1, font:{size:10}}}, x:{ticks:{font:{size:10}, maxRotation:0, minRotation:0, display:true}}} } 
        });
      }

      const centerTextPlugin = {
        id:'centerText',
        beforeDraw: c => {
          if(c.config.type!=='doughnut') return;
          const w = c.width, h = c.height, ctx = c.ctx;
          ctx.restore();
          
          const meta = c.getDatasetMeta(0);
          const centerX = meta.data.length ? meta.data[0].x : w/2;
          const centerY = meta.data.length ? meta.data[0].y : h/2;

          ctx.font = "bold " + (h/114).toFixed(2) + "em sans-serif";
          ctx.textBaseline = "middle";
          ctx.textAlign = "center";
          ctx.fillStyle = "#1f2937";
          
          const tot = c.data.datasets[0].data.reduce((a,b)=>a+b,0);
          ctx.fillText(tot.toString(), centerX, centerY - 6);
          
          ctx.font = "normal " + ((h/114).toFixed(2)*0.35) + "em sans-serif";
          ctx.fillText("Total Memo", centerX, centerY + 12);
          ctx.save();
        }
      };

      const sliceLabelsPlugin = { 
        id:'sliceLabels', 
        afterDatasetsDraw: c => { 
          if(c.config.type!=='doughnut') return; 
          const ctx=c.ctx, ds=c.data.datasets[0], tot=ds.data.reduce((a,b)=>a+b,0); 
          if(!tot) return; 
          c.getDatasetMeta(0).data.forEach((sec,i) => { 
            if(!ds.data[i]) return; 
            const pos=sec.tooltipPosition(); 
            ctx.fillStyle='#374151'; 
            ctx.font='bold 13px sans-serif'; 
            ctx.textAlign='center'; 
            ctx.textBaseline='middle'; 
            ctx.shadowColor='rgba(255,255,255,0.85)'; 
            ctx.shadowBlur=4; 
            ctx.fillText(Math.round((ds.data[i]/tot)*100)+'%', pos.x, pos.y); 
            ctx.shadowBlur=0; 
          }); 
        } 
      };

      const urgCtx = document.getElementById('acm-urgency-chart');
      if (urgCtx) {
        if(urgencyChart) urgencyChart.destroy();
        urgencyChart = new Chart(urgCtx, { type: 'doughnut', plugins: [customBgPlugin, centerTextPlugin, sliceLabelsPlugin], data: { labels:['1 month', '3 months', '6 months', '12 months'], datasets:[{data:[0,0,0,0], backgroundColor:['rgba(220, 38, 38, 0.45)', 'rgba(217, 119, 6, 0.45)', 'rgba(234, 179, 8, 0.45)', 'rgba(37, 99, 235, 0.45)'], borderColor:['rgba(220, 38, 38, 1)', 'rgba(217, 119, 6, 1)', 'rgba(234, 179, 8, 1)', 'rgba(37, 99, 235, 1)'], borderWidth:1, hoverOffset:4}] }, options: { responsive:true, maintainAspectRatio:false, cutout:'45%', plugins:{ legend:{position:'right', labels:{usePointStyle:true, pointStyle:'circle', boxWidth:8, font:{size:11}}}, tooltip:{ backgroundColor:'rgba(17, 24, 39, 0.95)', titleFont:{size:13, weight:'bold'}, bodyFont:{size:12}, padding:10, cornerRadius:8, callbacks:{ label: c => ` ${c.label||''}: ${c.raw||0} record${c.raw!==1?'s':''} (${Math.round(((c.raw||0)/(c.chart._metasets[c.datasetIndex].total||1))*100)}%)` } } } } });
      }

      updateDashboardUI();
    });
  }

  function checkbox(lbl, chk, path) { return `<label class="chk"><input type="checkbox" data-path="${path}" ${chk?'checked':''}/> ${lbl}</label>`; }
  function radio(nm, lbl, val, chk, path) { return `<label class="rad"><input type="radio" name="${nm}" data-path="${path}" value="${val}" ${chk?'checked':''}/> ${lbl}</label>`; }
  function field(lbl, path, val, typ='text', ext='') { return `<label class="f">${lbl}${typ==='textarea'?`<textarea data-path="${path}" ${ext}>${val||''}</textarea>`:`<input type="${typ}" data-path="${path}" value="${val||''}" ${ext}/>`}</label>`; }
  function selectField(lbl, path, val, opts) { return `<label class="f">${lbl}<select data-path="${path}"><option value=""></option>${opts.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select></label>`; }
  function groupField(lbl, tKey, bVal, vVal, isMainCat = false) { 
    const opts = isMainCat ? MAIN_CAT_OPTIONS : GROUP_OPTIONS;
    const specLabel = isMainCat ? 'Specify...' : 'Vendor Name...';
    const triggerVal = isMainCat ? 'Other' : 'Vendor';
    return `<label class="f">${lbl}<div style="display:flex;gap:6px"><select style="flex:1;min-width:0" data-calc-group="${tKey}" data-part="base"><option value=""></option>${opts.map(o=>`<option value="${o}" ${bVal===o?'selected':''}>${o}</option>`).join('')}</select>${bVal===triggerVal?`<input type="text" style="flex:1;min-width:0" placeholder="${specLabel}" data-calc-group="${tKey}" data-part="vendor" value="${vVal}"/>`:''}</div></label>`; 
  }
  function searchableSelectField(lbl, path, val, opts, lid) { return `<label class="f">${lbl}<input type="text" data-path="${path}" value="${val||''}" list="${lid}" autocomplete="off" placeholder="Type or select..."/><datalist id="${lid}">${opts.map(o=>`<option value="${o}"></option>`).join('')}</datalist></label>`; }

  function updateHighlights(container, r) {
    if (!state.showErrors) return;
    container.querySelectorAll('.err-highlight, .err-sec').forEach(el => el.classList.remove('err-highlight', 'err-sec'));
    
    let igBase = r.issuedGroup || ''; 
    if(igBase.toUpperCase().startsWith('OTHER:')) igBase = 'Other';
    
    ['happeningDate', 'issuedBy', 'reportNo', 'title', 'area', 'subArea', 'areaNo'].forEach(k => { if(!checkReq(r[k])) container.querySelector(`[data-path="${k}"]`)?.classList.add('err-highlight'); });
    
    if (igBase) {
        if(!checkReq(r.lineEquipment)) container.querySelector(`[data-path="lineEquipment"]`)?.classList.add('err-highlight');
        let needsEquipNo = igBase !== 'Other' && igBase !== 'Maintenance';
        let needsConvItem = ['Conveyor Line', 'Equipment/Tool'].includes(igBase);
        
        if (needsEquipNo && !checkReq(r.equipNo)) container.querySelector(`[data-path="equipNo"]`)?.classList.add('err-highlight');
        if (needsConvItem && !checkReq(r.conveyorItem)) container.querySelector(`[data-path="conveyorItem"]`)?.classList.add('err-highlight');
    }

    if((r.reasonDetail||'').trim().split(/\s+/).filter(w=>w.length>0).length < 2) container.querySelector('[data-path="reasonDetail"]')?.classList.add('err-highlight');
    if(!igBase || (igBase.toUpperCase() === 'OTHER' && (r.issuedGroup||'').trim().toUpperCase() === 'OTHER')) container.querySelectorAll('[data-calc-group="issuedGroup"]').forEach(el=>el.classList.add('err-highlight'));
    if(!(r.cat1 && Object.keys(CATS).some(k=>r.cat1[k]))) container.querySelector('#sec-category')?.classList.add('err-sec');
    if(!r.urgency) container.querySelector('#sec-urgency')?.classList.add('err-sec');
  }

    let l3OptsArea = ['All'];

            ${selectField(curCat, 'lineEquipment', r.lineEquipment, l1Opts)}
            ${field('Remarks', 'equipNo', r.equipNo)}
        </div>`;
    } else if (curCat === 'Maintenance') {

      let needsEquipNo = igBase !== 'Other' && igBase !== 'Maintenance';
      let needsConvItem = ['Conveyor Line', 'Equipment/Tool'].includes(igBase);

         errs.push("[Title & Criteria Details] Title and Area fields are required");

             errs.push("[Title & Criteria Details] Criteria specific fields are required");

      if(!r.urgency) errs.push("[Degree of Urgency] Please select one");

      else {

                <td><input type="text" placeholder="Auto-pulled from Vendor Mgt" readonly style="background:var(--line);cursor:not-allowed"/></td>
