                <div style="display:flex; gap: 8px;">
                    <button class="btn btn-ghost" id="contract-toggle-table-btn" style="padding:4px 10px;font-size:.75rem">${toggleBtnText}</button>
                    <button class="btn btn-primary" id="clm-submit-btn" style="background:var(--ok);padding:4px 10px;font-size:.75rem">Save CLM Updates ✔</button>
                </div>
            </div>
            
            <div class="grid g4" style="margin-bottom:14px">
                ${field('Expected Completion Date (ECD)', 'ecd', r.ecd, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Contract Duration', 'contractDuration', r.contractDuration, 'text', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Start Date', 'startDate', r.startDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('End Date', 'endDate', r.endDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
            </div>

            <table class="editrows" style="display:${tableDisplay}">
              <thead>
                <tr>
                  <th style="width:24%">CLM Stage</th>
                  <th style="width:14%">Date</th>
                  <th style="width:18%">PIC / Owner</th>
                  <th style="width:16%">Status / Outcome</th>
                  <th style="width:28%">Remarks / Details</th>
                </tr>
              </thead>
              <tbody>${clmHtml}</tbody>
            </table>
        </div>`;
    }

    container.innerHTML = `<div class="form-shell">${listSec}${clmSec}</div>`;

    container.querySelectorAll('[data-act="sel-contract"]').forEach(row => {
        row.addEventListener('click', () => {
            state.activeId = String(row.getAttribute('data-id'));
            render();
        });
    });

    if (r) {
        const toggleBtn = container.querySelector('#contract-toggle-table-btn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                state.contractClmTableVisible = !state.contractClmTableVisible;
                render();
            });
        }

        container.querySelectorAll('[data-act="add-clm"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const key = btn.getAttribute('data-key');
                if(!r.clm) r.clm = { creation:[{}], negotiations:[{}], approval:[{}], monitoring:{}, renewal:{} };
                if(!Array.isArray(r.clm[key])) r.clm[key] = [r.clm[key]]; 
                r.clm[key].push({date:'',owner:'',status:'',remarks:''});
                state.isDirty = true;
                render();
            });
        });

        container.querySelectorAll('[data-act="rem-clm"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const key = btn.getAttribute('data-key');
                const idx = parseInt(btn.getAttribute('data-idx'));
                r.clm[key].splice(idx, 1);
                state.isDirty = true;
                render();
            });
        });

        container.querySelectorAll('[data-path]').forEach(el => {
            if (el.tagName !== 'SELECT' && el.tagName !== 'INPUT') return;
            el.addEventListener('input', () => {
                state.isDirty = true;
                setByPath(r, el.getAttribute('data-path'), el.value);
                saveRecords();
            });
        });

        container.querySelector('#clm-submit-btn').addEventListener('click', async () => {
            state.isDirty = false;
            state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
            saveRecords();
            const btn = container.querySelector('#clm-submit-btn'), ogTxt = btn.innerHTML; 
            btn.innerHTML = 'Saving ⏳'; btn.style.pointerEvents = 'none';
            try { 
                await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({payload: JSON.stringify(r)}) }); 
                setTimeout(async () => { await showModal("Success", "CLM updates saved to Google Sheets!", "alert"); render(); }, 1000); 
            } catch (e) { 
                console.error(e); await showModal("Error", "Saved locally.", "alert", true); btn.innerHTML = ogTxt; btn.style.pointerEvents = 'auto'; 
            }
        });
    }
  }

  function renderVendorManagement(container) {
    const vendors = state.records.filter(r => !r.isDraft && r.maintenanceType === 'Vendor Management').sort((a,b)=>b.createdAt-a.createdAt);
    let r = state.records.find(x => String(x.createdAt) === String(state.activeId));
    if (!r || r.maintenanceType !== 'Vendor Management') {
        r = vendors.length ? vendors[0] : null;
        if (r) state.activeId = String(r.createdAt);
    }

    const rows = vendors.map(c => {
        const isActive = r && String(c.createdAt) === String(r.createdAt);
        let latestStatus = 'Pending';
        let monitoringCount = c.vendorMonitoring ? c.vendorMonitoring.length : 0;
        
        let refDateStr = monitoringCount > 0 ? c.vendorMonitoring[c.vendorMonitoring.length - 1].date : c.startDate;
        let needsAttention = false;
        
        if (refDateStr) {
            let refDate = new Date(refDateStr);
            if (!isNaN(refDate.getTime())) {
                let limitDate = new Date(refDate);
                limitDate.setMonth(limitDate.getMonth() + 3);
                if (Date.now() > limitDate.getTime()) {
                    needsAttention = true;
                }
            }
        }
        
        if (needsAttention) {
            latestStatus = 'Need Attention';
        } else if (monitoringCount === 0) {
            latestStatus = 'Pending';
        } else {
            let hasNotMet = c.vendorMonitoring.some(hist => hist.metrics && hist.metrics.some(m => m.status === 'Not Met'));
            if (hasNotMet) latestStatus = 'Not Met';
            else latestStatus = 'Met';
        }
        
        let chipClass = 'chip-open';
        if(latestStatus === 'Need Attention') chipClass = 'chip-progress';
        else if(latestStatus === 'Met') chipClass = 'chip-done';
        else if(latestStatus === 'Not Met') chipClass = 'chip-crit';

        const vendorDisp = c.vendorNameBase === 'Other' ? (c.vendorNameOther || 'Other') : (c.vendorNameBase || '—');

        return `<tr style="${isActive ? 'background:var(--input-bg)' : ''}; cursor:pointer" data-act="sel-vendor" data-id="${c.createdAt}">
            <td><span class="mono-font" style="color:var(--accent);font-weight:700">${c.reportNo||'—'}</span></td>
            <td>${c.title||'—'}</td>
            <td>${c.issuedGroup||'—'}</td>
            <td>${vendorDisp}</td>
            <td>${c.startDate ? fmtDate({happeningDate: c.startDate}) : '—'}</td>
            <td>${c.endDate ? fmtDate({happeningDate: c.endDate}) : '—'}</td>
            <td style="text-align:center;font-weight:700;color:var(--ink-light)">${monitoringCount}</td>
            <td><span class="status-chip ${chipClass}">${latestStatus}</span></td>
        </tr>`;
    }).join('');

    const listSec = `<div class="sec" style="margin-top:20px"><div class="sec-title">Vendor List</div>
        <div class="table-panel" style="padding:0;border:none">
            ${vendors.length === 0 ? `<div class="empty-state">No Vendor Management records found. Create one in Record Input.</div>` : 
            `<table class="list"><thead><tr><th>Record No.</th><th>Title</th><th>Criteria</th><th>Vendor</th><th>Start Date</th><th>End Date</th><th>Monitoring</th><th>SLA Status</th></tr></thead><tbody>${rows}</tbody></table>`}
        </div>
    </div>`;

    let slaSec = '';
    let monitorHistorySec = '';
    if (r) {
        if (!r.vendorSla || !Array.isArray(r.vendorSla)) r.vendorSla = Array.from({length:6}, () => ({actual:'', status:'', pic:'', remarks:''}));
        
        const slaHtml = SLA_METRICS.map((m, i) => {
            const v = r.vendorSla[i] || {actual:'', status:'', pic:'', remarks:''};
            return `<tr>
                <td style="font-weight:700;color:var(--ink);vertical-align:top;padding-top:8px">${m.type}</td>
                <td style="font-weight:700;vertical-align:top;padding-top:8px">${m.name}</td>
                <td style="font-size:10px;vertical-align:top;padding-top:8px"><b>Target:</b> ${m.target}<br><span style="color:var(--text-sec)"><b>Measure:</b> ${m.measure}</span></td>
                <td style="vertical-align:top"><textarea data-path="vendorSla.${i}.actual" placeholder="Enter actual results..." style="min-height:48px">${v.actual||''}</textarea></td>
                <td style="vertical-align:top"><select data-path="vendorSla.${i}.status" style="width:100%;padding:6px;font-size:11px"><option value=""></option><option value="Met" ${v.status==='Met'?'selected':''}>Met</option><option value="Not Met" ${v.status==='Not Met'?'selected':''}>Not Met</option><option value="N/A" ${v.status==='N/A'?'selected':''}>N/A</option></select></td>
                <td style="vertical-align:top"><input type="text" data-path="vendorSla.${i}.pic" value="${v.pic||''}" placeholder="Name..." style="width:100%;font-size:11px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--input-bg)"/></td>
                <td style="vertical-align:top"><textarea data-path="vendorSla.${i}.remarks" placeholder="Remarks..." style="min-height:48px">${v.remarks||''}</textarea></td>
            </tr>`;
        }).join('');

        const tableDisplay = state.vendorSlaTableVisible ? 'table' : 'none';
        const toggleBtnText = state.vendorSlaTableVisible ? 'Hide Table' : 'Table';

        slaSec = `<div class="sec">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div class="sec-title" style="margin:0">Service Level Agreement (SLA) & Key Performance Indicator (KPI) - ${r.reportNo}</div>
                <div style="display:flex; gap: 8px;">
                    <button class="btn btn-ghost" id="vendor-toggle-table-btn" style="padding:4px 10px;font-size:.75rem">${toggleBtnText}</button>
                    <button class="btn btn-primary" id="vendor-submit-btn" style="background:var(--ok);padding:4px 10px;font-size:.75rem">Save SLA Updates ✔</button>
                </div>
            </div>
            <div class="grid g4" style="margin-bottom:14px">
                ${field('Contract Duration', 'contractDuration', r.contractDuration, 'text', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('Start Date', 'startDate', r.startDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
                ${field('End Date', 'endDate', r.endDate, 'date', 'readonly style="background:var(--line);cursor:not-allowed"')}
            </div>
            <table class="editrows" style="margin-bottom:12px; display:${tableDisplay}">
              <thead>
                <tr>
                  <th style="width:10%">Metric Type</th>
                  <th style="width:14%">Metric Name</th>
                  <th style="width:25%">Target / Measurement</th>
                  <th style="width:18%">Actual Performance</th>
                  <th style="width:9%">Status</th>
                  <th style="width:12%">PIC / Owner</th>
                  <th style="width:12%">Remarks</th>
                </tr>
              </thead>
              <tbody>${slaHtml}</tbody>
            </table>
            <div style="display:${state.vendorSlaTableVisible ? 'flex' : 'none'};justify-content:flex-end;">
               <button class="btn btn-primary" id="vendor-add-monitor-btn" style="padding:4px 10px;font-size:.75rem">✚ Add Monitoring</button>
            </div>
        </div>`;

        if (r.vendorMonitoring && r.vendorMonitoring.length > 0) {
            const histHtml = r.vendorMonitoring.slice().reverse().map((hist, i) => {
               const origIdx = r.vendorMonitoring.length - 1 - i;
               return `
               <div style="margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;">
                 <div style="background: var(--line); padding: 8px 12px; font-weight: 700; font-size: .85rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;">
                   <span>Date: ${hist.date ? fmtDate({happeningDate: hist.date}) : '—'}</span>
                   <div style="display:flex; gap: 6px;">
                       <button class="btn btn-ghost" data-act="edit-monitor" data-idx="${origIdx}" style="padding: 2px 8px; font-size: .65rem; background: var(--paper);">Edit</button>
                       <button class="btn btn-danger" data-act="del-monitor" data-idx="${origIdx}" style="padding: 2px 8px; font-size: .65rem;">Delete</button>
                   </div>
                 </div>
                 <table class="list" style="margin: 0; width: 100%;">
                   <thead>
                     <tr>
                       <th style="width:24%">Metric</th>
                       <th style="width:26%">Actual Performance</th>
                       <th style="width:10%">Status</th>
                       <th style="width:15%">PIC / Owner</th>
                       <th style="width:25%">Remarks</th>
                     </tr>
                   </thead>
                   <tbody>
                     ${hist.metrics.map((m, idx) => `
                       <tr>
                         <td><b>${SLA_METRICS[idx].name}</b></td>
                         <td>${m.actual || '—'}</td>
                         <td><span class="status-chip ${m.status==='Met'?'chip-done':m.status==='Not Met'?'chip-progress':'chip-open'}">${m.status || '—'}</span></td>
                         <td>${m.pic || '—'}</td>
                         <td>${m.remarks || '—'}</td>
                       </tr>
                     `).join('')}
                   </tbody>
                 </table>
               </div>
             `;
            }).join('');
             
            monitorHistorySec = `<div class="sec">
                <div class="sec-title">Monitoring History</div>
                ${histHtml}
            </div>`;
        } else {
            monitorHistorySec = `<div class="sec">
                <div class="sec-title">Monitoring History</div>
                <div class="empty-state" style="padding:16px 0">No monitoring history available.</div>
            </div>`;
        }
    }

    container.innerHTML = `<div class="form-shell">${listSec}${slaSec}${monitorHistorySec}</div>`;

    container.querySelectorAll('[data-act="sel-vendor"]').forEach(row => {
        row.addEventListener('click', () => {
            state.activeId = String(row.getAttribute('data-id'));
            render();
        });
    });

    if (r) {
        const toggleBtn = container.querySelector('#vendor-toggle-table-btn');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                state.vendorSlaTableVisible = !state.vendorSlaTableVisible;
                render();
            });
        }

        container.querySelectorAll('[data-act="del-monitor"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                const idx = parseInt(btn.getAttribute('data-idx'));
                const confirm = await showModal("Confirm Deletion", "Are you sure you want to delete this monitoring record?", "confirm");
                if (confirm) {
                    r.vendorMonitoring.splice(idx, 1);
                    state.isDirty = true;
                    saveRecords();
                    render();
                }
            });
        });

        container.querySelectorAll('[data-act="edit-monitor"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                const idx = parseInt(btn.getAttribute('data-idx'));
                const confirm = await showModal("Edit Monitoring", "Load this record into the input table? (It will be removed from history until you click '+ Add Monitoring' again)", "confirm-edit");
                if (confirm) {
                    state.editMonitorDate = r.vendorMonitoring[idx].date;
                    r.vendorSla = JSON.parse(JSON.stringify(r.vendorMonitoring[idx].metrics));
                    r.vendorMonitoring.splice(idx, 1);
                    state.vendorSlaTableVisible = true;
                    state.isDirty = true;
                    saveRecords();
                    render();
                }
            });
        });

        container.querySelectorAll('[data-path]').forEach(el => {
            if (el.tagName !== 'SELECT' && el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return;
            el.addEventListener('input', () => {
                state.isDirty = true;
                setByPath(r, el.getAttribute('data-path'), el.value);
                saveRecords();
            });
        });

        container.querySelector('#vendor-submit-btn').addEventListener('click', async () => {
            state.isDirty = false;
            state.cleanActiveRecord = JSON.parse(JSON.stringify(r));
            saveRecords();
            const btn = container.querySelector('#vendor-submit-btn'), ogTxt = btn.innerHTML; 
            btn.innerHTML = 'Saving ⏳'; btn.style.pointerEvents = 'none';
            try { 
                await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({payload: JSON.stringify(r)}) }); 
                setTimeout(async () => { await showModal("Success", "Vendor SLA updates saved to Google Sheets!", "alert"); render(); }, 1000); 
            } catch (e) { 
                console.error(e); await showModal("Error", "Saved locally.", "alert", true); btn.innerHTML = ogTxt; btn.style.pointerEvents = 'auto'; 
            }
        });
        
        container.querySelector('#vendor-add-monitor-btn').addEventListener('click', async () => {
            let valid = true;
            for(let i=0; i<6; i++) {
                const actualEl = container.querySelector(`[data-path="vendorSla.${i}.actual"]`);
                const statusEl = container.querySelector(`[data-path="vendorSla.${i}.status"]`);
                if (actualEl && statusEl) {
                    actualEl.classList.remove('err-highlight');
                    statusEl.classList.remove('err-highlight');
                    if(!r.vendorSla[i].actual || r.vendorSla[i].actual.trim() === '') {
                        actualEl.classList.add('err-highlight');
                        valid = false;
                    }
                    if(!r.vendorSla[i].status || r.vendorSla[i].status.trim() === '') {
                        statusEl.classList.add('err-highlight');
                        valid = false;
                    }
                }
            }
            if(!valid) {
                state.vendorSlaTableVisible = true;
                render();
                setTimeout(async () => {
                    await showModal("Validation Error", "Please fill in Actual Performance and Status for all metrics.", "alert", true);
                }, 50);
                return;
            }
            const defaultDate = state.editMonitorDate || '';
            const mDate = await showModal("Monitoring Date", "Select the date for this monitoring record:", "prompt-date", defaultDate);
            if(!mDate) return;
            
            await showModal("Success", `Monitoring record for ${mDate} added to history.`, "alert");
            if(!r.vendorMonitoring) r.vendorMonitoring = [];
            r.vendorMonitoring.push({ date: mDate, metrics: JSON.parse(JSON.stringify(r.vendorSla)) });
            r.vendorSla = Array.from({length:6}, () => ({actual:'', status:'', pic:'', remarks:''}));
            
            state.editMonitorDate = null;
            state.vendorSlaTableVisible = false;
            state.isDirty = true;
            saveRecords();
            render();
        });
    }
  }

  function setByPath(obj, path, value) { const parts = path.split('.'); let cur = obj; for (let i = 0; i < parts.length - 1; i++) { cur = cur[isFinite(parts[i]) ? Number(parts[i]) : parts[i]]; } cur[parts[parts.length - 1]] = value; }

  function renderBlank(container, title) {
    container.innerHTML = `<div class="panel" style="min-height:400px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--line-dark); background:transparent;"><div class="empty-state" style="font-size:1.1rem; color:var(--text-sec); font-weight:600">The <b>${title}</b> module is currently blank and under development.</div></div>`;
  }

  function render() {
    ROOT.innerHTML = `<div class="wrap"><div class="topbar"><div class="brand"><div class="k">KLIA - Baggage Handling System T1</div><div class="t">BHS Maintenance : Resource Management Monitoring</div></div><div class="tabs">${ALL_TABS.map(t => `<button class="tab-btn ${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div></div><div id="acm-content"></div></div>`;
    ROOT.querySelectorAll('.tab-btn').forEach(b => {
      b.addEventListener('click', async () => { 
        const targetTab = b.getAttribute('data-tab');
        if (state.tab === 'Record Input' && targetTab !== 'Record Input' && state.isDirty) { const discard = await showModal("Unsaved Changes Detected", "You have entered or modified data that has not been submitted yet.\n\nPlease click \"Submit ✔\" to record your data, or click \"Discard Data\" to abandon your recent changes.", "unsaved"); if (!discard) return; revertActiveRecord(); }
        state.tab = targetTab; render(); 
      });
    });
    const content = document.getElementById('acm-content');
    if (!state.loaded) { content.innerHTML = `<div class="empty-state">Loading records…</div>`; return; }
    
    if (state.tab === 'Dashboard') renderDashboard(content);
    else if (state.tab === 'Record Input') renderInput(content);
    else if (state.tab === 'Contract Management') renderContractManagement(content);
    else if (state.tab === 'Vendor Management') renderVendorManagement(content);
    else if (BLANK_TABS.includes(state.tab)) renderBlank(content, state.tab);
  }

  render();
  loadRecords();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
